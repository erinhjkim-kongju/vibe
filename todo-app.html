<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 할 일</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#14213d;--sub:#6b778c;--line:#dde3ec;--study:#2f5de4;--studybg:#e4ebff;--life:#0f9d76;--lifebg:#dcf5ec;--done:#a6b0c0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:26px;margin:0 0 18px;letter-spacing:-.02em}
.date{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.date input{flex:1;font:inherit;font-weight:500;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
button{font:inherit;cursor:pointer;color:var(--ink)}
.nav{width:42px;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:18px}
.today{height:42px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--ink);color:#fff;border-radius:14px;margin-bottom:8px}
.stats div{padding:14px 8px;text-align:center}
.stats div+div{border-left:1px solid #ffffff2e}
.stats b{display:block;font-size:28px;line-height:1.1}
.stats span{font-size:13px;opacity:.75}
.bar{height:6px;background:var(--line);border-radius:3px;margin-bottom:18px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--life);transition:width .3s}
form{display:flex;flex-wrap:wrap;gap:8px;background:var(--card);padding:12px;border-radius:14px;margin-bottom:16px}
form input[type=text]{flex:1 1 200px;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;color:var(--ink)}
select{font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.add{padding:10px 18px;border:0;border-radius:10px;background:var(--study);color:#fff;font-weight:700}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{padding:7px 14px;border:1px solid var(--line);border-radius:20px;background:transparent;color:var(--sub)}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li{display:flex;align-items:center;gap:10px;background:var(--card);padding:12px;border-radius:12px;border-left:5px solid var(--study)}
li.life{border-left-color:var(--life)}
li input[type=checkbox]{width:20px;height:20px;accent-color:var(--life);flex:none}
.txt{flex:1;min-width:0;word-break:break-word}
.txt input{width:100%;font:inherit;padding:4px 6px;border:1px solid var(--study);border-radius:6px}
li.done .txt span{color:var(--done);text-decoration:line-through}
.tag{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--studybg);color:var(--study);flex:none}
li.life .tag{background:var(--lifebg);color:var(--life)}
.act{border:0;background:none;color:var(--sub);padding:4px 6px;font-size:13px}
.act:hover{color:var(--ink)}
.empty{text-align:center;color:var(--sub);padding:28px 0}
:focus-visible{outline:2px solid var(--study);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <h1>오늘의 할 일</h1>
  <div class="date">
    <button class="nav" id="prev" aria-label="전날">‹</button>
    <input type="date" id="date" aria-label="날짜 선택">
    <button class="nav" id="next" aria-label="다음 날">›</button>
    <button class="today" id="today">오늘</button>
  </div>
  <div class="stats">
    <div><b id="sTotal">0</b><span>전체</span></div>
    <div><b id="sDone">0</b><span>완료</span></div>
    <div><b id="sLeft">0</b><span>남은 일</span></div>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <form id="form">
    <input type="text" id="input" placeholder="할 일을 입력하세요" maxlength="80" required>
    <select id="cat" aria-label="카테고리"><option value="study">학업</option><option value="life">일상</option></select>
    <button class="add" type="submit">추가</button>
  </form>
  <div class="tabs" id="tabs">
    <button data-f="all" class="on">전체</button>
    <button data-f="active">진행 중</button>
    <button data-f="done">완료</button>
  </div>
  <ul id="list"></ul>
</div>
<script>
const KEY='todayTodos.v1';
let todos=[],filter='all',editing=null;
try{todos=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){todos=[]}
const $=id=>document.getElementById(id);
const ymd=d=>{const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())};
let cur=ymd(new Date());
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(todos))}catch(e){}};
const shift=n=>{const d=new Date(cur+'T00:00:00');d.setDate(d.getDate()+n);cur=ymd(d);editing=null;render()};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){
  $('date').value=cur;
  const day=todos.filter(t=>t.date===cur);
  const done=day.filter(t=>t.done).length;
  $('sTotal').textContent=day.length;
  $('sDone').textContent=done;
  $('sLeft').textContent=day.length-done;
  $('bar').style.width=day.length?done/day.length*100+'%':'0';
  const shown=day.filter(t=>filter==='all'||(filter==='done')===t.done);
  $('list').innerHTML=shown.length?shown.map(t=>`
    <li class="${t.cat} ${t.done?'done':''}">
      <input type="checkbox" data-id="${t.id}" data-a="check" ${t.done?'checked':''} aria-label="완료 체크">
      <div class="txt">${editing===t.id?`<input id="edit" value="${esc(t.text)}" maxlength="80">`:`<span>${esc(t.text)}</span>`}</div>
      <span class="tag">${t.cat==='study'?'학업':'일상'}</span>
      ${editing===t.id
        ?`<button class="act" data-id="${t.id}" data-a="save">저장</button>`
        :`<button class="act" data-id="${t.id}" data-a="edit">수정</button>`}
      <button class="act" data-id="${t.id}" data-a="del">삭제</button>
    </li>`).join('')
    :`<li class="empty" style="display:block;border:0;background:none">${day.length?'이 목록에 할 일이 없어요.':'이 날의 할 일이 아직 없어요. 위에서 추가해 보세요.'}</li>`;
  const e=$('edit');if(e){e.focus();e.onkeydown=k=>{if(k.key==='Enter')commit(editing);if(k.key==='Escape'){editing=null;render()}}}
}
function commit(id){
  const v=$('edit').value.trim(),t=todos.find(x=>x.id===id);
  if(t&&v)t.text=v;editing=null;save();render();
}
$('form').onsubmit=e=>{
  e.preventDefault();
  const text=$('input').value.trim();if(!text)return;
  todos.push({id:Date.now()+Math.random(),text,cat:$('cat').value,date:cur,done:false});
  $('input').value='';save();render();
};
$('list').onclick=e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const id=parseFloat(b.dataset.id),a=b.dataset.a,t=todos.find(x=>x.id===id);
  if(a==='check'){t.done=!t.done}
  else if(a==='del'){todos=todos.filter(x=>x.id!==id)}
  else if(a==='edit'){editing=id;render();return}
  else if(a==='save'){commit(id);return}
  save();render();
};
$('tabs').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  filter=b.dataset.f;
  [...$('tabs').children].forEach(x=>x.classList.toggle('on',x===b));
  render();
};
$('date').onchange=e=>{if(e.target.value){cur=e.target.value;editing=null;render()}};
$('prev').onclick=()=>shift(-1);
$('next').onclick=()=>shift(1);
$('today').onclick=()=>{cur=ymd(new Date());editing=null;render()};
render();
</script>
</body>
</html>
