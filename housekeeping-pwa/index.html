<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b6e4f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가계부">
<title>지출 관리 가계부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 월 선택 → 요약 → 지출 추가(영수증·직접) → 차트 3종 → 날짜별 내역. 금액은 고정폭 숫자, 오른쪽 정렬. */
:root {
  --paper: #f3f6f4;
  --surface: #ffffff;
  --ink: #16211d;
  --muted: #5b6b65;
  --line: #d5ddd9;
  --accent: #0b6e4f;
  --accent-ink: #ffffff;
  --accent-soft: #e2f1ea;
  --bar-rest: #a9cdbf;
  --warn: #8a5a00;
  --warn-soft: #fbefd3;
  --crit: #a32a22;
  --crit-soft: #fbe3e0;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --font-num: "IBM Plex Mono", "D2Coding", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111815; --surface: #1a2320; --ink: #e7eeea; --muted: #9aaba4; --line: #2e3b36;
    --accent: #4fc29a; --accent-ink: #0a1a14; --accent-soft: #1b3a2e; --bar-rest: #2f6b56;
    --warn: #f0c060; --warn-soft: #3a2f12; --crit: #ff9a90; --crit-soft: #40201d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111815; --surface: #1a2320; --ink: #e7eeea; --muted: #9aaba4; --line: #2e3b36;
  --accent: #4fc29a; --accent-ink: #0a1a14; --accent-soft: #1b3a2e; --bar-rest: #2f6b56;
  --warn: #f0c060; --warn-soft: #3a2f12; --crit: #ff9a90; --crit-soft: #40201d;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 28px 20px 56px; display: flex; flex-direction: column; gap: 20px; }

header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.01em; }
header p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.monthnav { display: flex; align-items: center; gap: 8px; }
.monthnav strong { font-size: 20px; font-weight: 600; min-width: 128px; text-align: center; font-variant-numeric: tabular-nums; }

button, select, input { font: inherit; }
button {
  font-size: 15px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 6px; padding: 6px 12px;
}
button:hover { border-color: var(--accent); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
button.small { font-size: 14px; padding: 3px 9px; }
button[hidden] { display: none; }

dl { margin: 0; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
@media (max-width: 760px) { .stats { grid-template-columns: 1fr 1fr; } }
.stat { background: var(--surface); padding: 14px 18px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat dt { color: var(--muted); font-size: 14px; }
.stat dd { margin: 0; font-family: var(--font-num); font-size: 24px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat dd.txt { font-family: var(--font-body); font-weight: 600; font-size: 22px; }
.stat dd small { font-family: var(--font-body); font-weight: 400; font-size: 14px; color: var(--muted); margin-left: 3px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.panel > h2, .bar h2 { margin: 0; font-size: 18px; font-weight: 600; }
.panel > h2 { padding: 14px 18px 0; }
.panel .sub { margin: 0; padding: 0 18px; color: var(--muted); font-size: 14px; }
.body { padding: 14px 18px 18px; }

.add { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 16px; }
@media (max-width: 860px) { .add { grid-template-columns: 1fr; } }
.drop {
  display: flex; flex-direction: column; justify-content: center; gap: 6px; height: 100%;
  background: var(--paper); border: 2px dashed var(--line); border-radius: 8px; padding: 18px 20px; cursor: pointer; min-height: 132px;
}
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
.drop strong { font-weight: 600; }
.drop span { color: var(--muted); font-size: 14px; }
.drop .pick { align-self: flex-start; margin-top: 4px; background: var(--accent); color: var(--accent-ink); border-radius: 6px; padding: 6px 13px; font-weight: 500; font-size: 15px; }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }

form.manual { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px 12px; align-items: end; }
.fld { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.fld label { font-size: 14px; color: var(--muted); }
.fld input, .fld select {
  width: 100%; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; min-height: 40px;
}
.f-date { grid-column: span 2; } .f-merchant { grid-column: span 2; } .f-amount { grid-column: span 2; }
.f-cat { grid-column: span 2; } .f-memo { grid-column: span 3; } .f-go { grid-column: span 1; }
.f-go button { width: 100%; min-height: 40px; }
@media (max-width: 560px) { form.manual { grid-template-columns: 1fr 1fr; } form.manual .fld { grid-column: span 1; } form.manual .f-memo, form.manual .f-go { grid-column: span 2; } }
.err { grid-column: 1 / -1; margin: 0; color: var(--crit); font-size: 14px; min-height: 1.4em; }
input.amt { font-family: var(--font-num); font-variant-numeric: tabular-nums; text-align: right; }

.jobs { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.jobs:empty { display: none; }
.jobs li { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 14px; border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; }
.jobs .nm { overflow-wrap: anywhere; }
.jobs .msg { flex-basis: 100%; margin: 0; color: var(--crit); }

.notice { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; background: var(--warn-soft); color: var(--warn); border-left: 4px solid var(--warn); border-radius: 6px; padding: 10px 14px; font-size: 15px; }
.notice[hidden] { display: none; }

.pill { display: inline-block; font-size: 13px; font-weight: 500; white-space: nowrap; border-radius: 999px; padding: 2px 10px; background: var(--paper); color: var(--muted); border: 1px solid var(--line); }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.crit { background: var(--crit-soft); color: var(--crit); border-color: transparent; }
.pill.busy::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .pill.busy::before { animation: none; } }

/* 차트 */
.charts { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; }
.charts .wide { grid-column: 1 / -1; }
@media (max-width: 860px) { .charts { grid-template-columns: 1fr; } }
.empty { color: var(--muted); font-size: 15px; padding: 24px 0; text-align: center; }

.daily { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 8px; }
.yax { position: relative; height: 180px; min-width: 56px; }
.yax span { position: absolute; right: 0; transform: translateY(50%); font-family: var(--font-num); font-size: 12px; color: var(--muted); white-space: nowrap; }
.plot { position: relative; height: 180px; border-bottom: 1px solid var(--line); }
.plot i { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--line); }
.cols { position: absolute; inset: 0; display: flex; align-items: flex-end; gap: 2px; }
.col { flex: 1 1 0; height: 100%; display: flex; align-items: flex-end; min-width: 0; }
.col b { display: block; width: 100%; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 0; }
.col:hover b { filter: brightness(1.15); }
.xax { grid-column: 2; display: flex; gap: 2px; padding-top: 4px; }
.xax span { flex: 1 1 0; min-width: 0; text-align: center; font-family: var(--font-num); font-size: 12px; color: var(--muted); overflow: visible; white-space: nowrap; }

.cats { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 9px 12px; align-items: center; }
.cats .lab { font-size: 15px; white-space: nowrap; }
.cats .trk { height: 14px; }
.cats .trk b { display: block; height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; min-width: 2px; }
.cats .val { font-family: var(--font-num); font-size: 14px; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.cats .val small { font-family: var(--font-body); color: var(--muted); margin-left: 6px; }

.trend { display: flex; align-items: flex-end; gap: 10px; height: 200px; }
.tcol { flex: 1 1 0; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: stretch; gap: 4px; padding: 0; border: 0; background: none; border-radius: 6px; }
.tcol .v { font-family: var(--font-num); font-size: 13px; color: var(--muted); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tcol b { display: block; background: var(--bar-rest); border-radius: 4px 4px 0 0; min-height: 2px; margin: 0 14%; }
.tcol .m { font-size: 14px; color: var(--muted); text-align: center; border-top: 1px solid var(--line); padding-top: 4px; }
.tcol.on b { background: var(--accent); }
.tcol.on .v, .tcol.on .m { color: var(--ink); font-weight: 600; }
.tcol:hover b { filter: brightness(1.1); }

#tip { position: fixed; z-index: 10; pointer-events: none; background: var(--ink); color: var(--paper); font-size: 13px; padding: 4px 9px; border-radius: 5px; white-space: nowrap; }
#tip[hidden] { display: none; }

/* 내역 */
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--line); }
.bar .hint { color: var(--muted); font-size: 14px; font-weight: 400; margin-left: 8px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 900px; }
th, td { padding: 7px 8px; text-align: left; vertical-align: middle; border-bottom: 1px solid var(--line); }
thead th { font-size: 14px; font-weight: 500; color: var(--muted); white-space: nowrap; }
th.r { text-align: right; }
tr.g th { background: var(--paper); font-weight: 600; font-size: 15px; padding: 8px 16px; }
tr.g .gt { float: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
tr.g .gn { font-weight: 400; color: var(--muted); font-size: 14px; margin-left: 8px; }
td:first-child, thead th:first-child { padding-left: 16px; }
td input, td select { width: 100%; color: var(--ink); background: transparent; border: 1px solid transparent; border-radius: 5px; padding: 5px 7px; }
td select { border-color: var(--line); background: var(--surface); padding-right: 4px; }
td input:hover:not(:disabled) { border-color: var(--line); }
td input:focus { border-color: var(--accent); background: var(--surface); }
td input::placeholder { color: var(--muted); opacity: .8; }
td input.need::placeholder { color: var(--warn); opacity: 1; }
td input:disabled, td select:disabled { opacity: 1; color: var(--ink); }
.c-date { width: 158px; } .c-cat { width: 200px; } .c-amt { width: 130px; } .c-src { width: 150px; white-space: nowrap; } .c-merchant { min-width: 160px; }
.catcell { display: flex; align-items: center; gap: 6px; }
.auto { font-size: 12px; color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 0 5px; white-space: nowrap; }
.auto[hidden] { display: none; }
.foot { padding: 10px 18px; color: var(--muted); font-size: 14px; }
.add.noai { grid-template-columns: 1fr; }
.tcol .v .s { display: none; }

/* 스마트폰: 표를 카드 목록으로 바꾸고 누르기 쉬운 크기로 */
@media (max-width: 720px) {
  .wrap { padding: 18px 14px 40px; gap: 16px; }
  h1 { font-size: 24px; }
  header { align-items: stretch; }
  .monthnav { width: 100%; justify-content: space-between; }
  .monthnav strong { flex: 1; min-width: 0; }
  button { min-height: 40px; }
  .stat { padding: 12px 14px; }
  .stat dd { font-size: 20px; }
  .stat dd.txt { font-size: 19px; }
  .body { padding: 12px 14px 16px; }
  .panel > h2 { padding: 12px 14px 0; }
  .panel .sub { padding: 0 14px; }
  .bar { padding: 12px 14px; }
  .yax { min-width: 48px; }
  .cats { gap: 8px 8px; }
  .cats .lab { font-size: 14px; }
  .trend { gap: 4px; height: 180px; }
  .tcol b { margin: 0 8%; }
  .tcol .v .f { display: none; }
  .tcol .v .s { display: inline; }
  .scroll { overflow-x: visible; }
  table { min-width: 0; }
  thead { display: none; }
  tbody, tbody tr, tbody td, tbody th { display: block; }
  tbody td { border: 0; padding: 0; width: auto; min-width: 0; }
  tbody td:first-child { padding-left: 0; }
  tr.g th { padding: 8px 14px; }
  tbody tr[data-id] { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .c-date, .c-cat, .c-amt, .c-src { width: auto; }
  .catcell select { flex: 1; }
  .c-merchant { grid-column: 1 / -1; order: 1; }
  .c-merchant input { font-weight: 600; }
  .c-date { order: 2; } .c-amt { order: 3; }
  .c-cat { order: 4; grid-column: 1 / -1; }
  .c-memo { order: 5; grid-column: 1 / -1; }
  .c-src { order: 6; align-self: center; }
  .c-del { order: 7; text-align: right; }
  td input, td select { border-color: var(--line); background: var(--surface); min-height: 40px; }
  .foot { padding: 10px 14px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>지출 관리 가계부</h1>
      <p id="save-state">지출을 추가하면 이 브라우저에 자동으로 저장됩니다.</p>
    </div>
    <div class="monthnav">
      <button type="button" id="m-prev" aria-label="이전 달">◀</button>
      <strong id="m-label" aria-live="polite"></strong>
      <button type="button" id="m-next" aria-label="다음 달">▶</button>
      <button type="button" id="m-today">이번 달</button>
      <button type="button" class="primary" id="btn-install" hidden>앱 설치</button>
    </div>
  </header>

  <dl class="stats" aria-label="선택한 달 요약">
    <div class="stat"><dt>총 지출</dt><dd id="st-total"></dd></div>
    <div class="stat"><dt>지출 건수</dt><dd id="st-count"></dd></div>
    <div class="stat"><dt>하루 평균</dt><dd id="st-avg"></dd></div>
    <div class="stat"><dt>가장 많이 쓴 항목</dt><dd class="txt" id="st-top"></dd></div>
  </dl>

  <section class="panel">
    <h2>지출 추가</h2>
    <div class="body">
      <div class="add">
        <div>
          <label class="drop" id="drop" for="file">
            <strong>영수증으로 추가</strong>
            <span>이미지(JPG, PNG, WebP, GIF)나 ZIP 파일을 끌어다 놓으면 내용을 읽어 지출로 등록합니다.</span>
            <span class="pick">파일 선택</span>
            <input type="file" id="file" multiple accept="image/jpeg,image/png,image/webp,image/gif,.zip,application/zip">
          </label>
        </div>
        <form class="manual" id="manual" novalidate>
          <div class="fld f-date"><label for="n-date">날짜</label><input type="date" id="n-date"></div>
          <div class="fld f-merchant"><label for="n-merchant">사용처</label><input id="n-merchant" autocomplete="off" placeholder="예: 금강식당"></div>
          <div class="fld f-amount"><label for="n-amount">금액(원)</label><input id="n-amount" class="amt" inputmode="numeric" autocomplete="off" placeholder="0"></div>
          <div class="fld f-cat"><label for="n-cat">항목</label><select id="n-cat"></select></div>
          <div class="fld f-memo"><label for="n-memo">메모</label><input id="n-memo" autocomplete="off" placeholder="선택 사항"></div>
          <div class="fld f-go"><button type="submit" class="primary">직접 추가</button></div>
          <p class="err" id="n-err" role="alert"></p>
        </form>
      </div>
      <ul class="jobs" id="jobs" aria-label="분석 중인 영수증"></ul>
    </div>
  </section>

  <div class="notice" id="notice" role="status" hidden>
    <span id="notice-text"></span>
    <button type="button" class="small" id="notice-btn" hidden></button>
  </div>

  <section class="charts">
    <div class="panel wide">
      <h2>날짜별 지출</h2>
      <p class="sub" id="daily-sub"></p>
      <div class="body" id="chart-daily"></div>
    </div>
    <div class="panel">
      <h2>항목별 지출</h2>
      <p class="sub" id="cat-sub"></p>
      <div class="body" id="chart-cat"></div>
    </div>
    <div class="panel">
      <h2>월별 지출</h2>
      <p class="sub">막대를 누르면 그 달로 이동합니다.</p>
      <div class="body" id="chart-trend"></div>
    </div>
  </section>

  <section class="panel">
    <div class="bar">
      <h2>지출 내역<span class="hint" id="hint"></span></h2>
      <div class="actions">
        <button type="button" id="btn-clear">전체 삭제</button>
        <button type="button" class="primary" id="btn-xlsx" hidden>엑셀 다운로드</button>
      </div>
    </div>
    <div class="scroll">
      <table>
        <thead>
          <tr><th>날짜</th><th>사용처</th><th>항목</th><th class="r">금액</th><th>메모</th><th>입력</th><th></th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="foot">항목은 사용처를 보고 자동으로 정해지며, 드롭다운에서 바꾸면 바꾼 항목이 유지됩니다. 내역은 이 브라우저에만 저장되므로 엑셀 다운로드로 백업해 두세요.</div>
  </section>
</div>
<div id="tip" hidden></div>

<script src="vendor/xlsx.full.min.js"></script>
<script>
(function () {
  "use strict";

  var KEY = "gagyebu.v1";
  var NA = "정보 없음";
  var FAIL_MSG = "이 영수증은 제대로 인식되지 않습니다. 다른 이미지를 업로드하시거나, 수동으로 정보를 피드백 해주세요.";

  });
  tbody.addEventListener("change", function (ev) {
    var el = ev.target, f = el.getAttribute("data-f"), e = entryOf(el);
    if (!e || e.ex || !f) return;
    if (f === "cat") {
      e.cat = el.value; e.catAuto = false;
      $("e-" + e.id + "-auto").hidden = true;
      save(); updateDerived();
    } else if (f === "date") {
      var was = e.date;
      e.date = DATE_RE.test(el.value) ? el.value : null;
      save();
      var keep = document.activeElement && document.activeElement.id;
      renderAll();
      if (keep && $(keep)) $(keep).focus();
      if (e.date && e.date.slice(0, 7) !== selYM && e.date !== was) {
        var ym = e.date.slice(0, 7);
        notice("지출을 " + ymLabel(ym) + "로 옮겼습니다.", "그 달 보기", function () { notice(""); goMonth(ym); });
      }
    } else {
      updateDerived();
    }
  });
  tbody.addEventListener("click", function (ev) {
    var btn = ev.target.closest("[data-act='del']");
    if (!btn) return;
    var e = entryOf(btn);
    if (!e) return;
    entries = entries.filter(function (x) { return x !== e; });
    save(); renderAll();
  });

  /* ---------- 직접 입력 ---------- */
  $("n-cat").innerHTML = catOptions("", true);
  $("n-date").value = todayStr();
  $("n-amount").addEventListener("input", function () { formatAmountInput(this); });
  $("manual").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var date = $("n-date").value, merchant = $("n-merchant").value.trim(), total = toAmount($("n-amount").value), cat = $("n-cat").value;
    var err = !DATE_RE.test(date) ? "날짜를 선택해 주세요." : !merchant ? "사용처를 입력해 주세요." : total == null ? "금액을 숫자로 입력해 주세요." : "";
    $("n-err").textContent = err;
    if (err) { (!DATE_RE.test(date) ? $("n-date") : !merchant ? $("n-merchant") : $("n-amount")).focus(); return; }
    dropExamples();
    entries.push({ id: newId(), date: date, merchant: merchant, total: total, vat: null, cat: cat || guessCat(merchant), catAuto: !cat, memo: $("n-memo").value.trim(), src: "manual" });
    save();
    selYM = date.slice(0, 7);
    $("n-merchant").value = ""; $("n-amount").value = ""; $("n-memo").value = ""; $("n-cat").value = "";
    notice("");
    renderAll();
    $("n-merchant").focus();
  });

  /* ---------- 영수증 ---------- */
  function renderJobs() {
    $("jobs").innerHTML = jobs.map(function (j) {
      var pill = j.status === "working" ? '<span class="pill busy">분석 중</span>'
        : j.status === "failed" ? '<span class="pill crit">인식 실패</span>' : '<span class="pill">대기</span>';
      var extra = j.status === "failed"
        ? '<button type="button" class="small" data-job="' + j.id + '" data-act="retry">다시 분석</button>' +
          '<button type="button" class="small" data-job="' + j.id + '" data-act="close">닫기</button>' +
          '<p class="msg">' + esc(FAIL_MSG) + "</p>"
        : "";
      return "<li>" + pill + '<span class="nm">' + esc(j.name) + "</span>" + extra + "</li>";
    }).join("");
  }
  $("jobs").addEventListener("click", function (ev) {
    var btn = ev.target.closest("[data-job]");
    if (!btn) return;
    var id = Number(btn.getAttribute("data-job")), j = jobs.filter(function (x) { return x.id === id; })[0];
    if (!j) return;
    if (btn.getAttribute("data-act") === "retry") { j.status = "queued"; j.retried = true; queue.push(j); renderJobs(); pump(); }
    else { jobs = jobs.filter(function (x) { return x !== j; }); renderJobs(); }
  });

  function isZip(f) { return /\.zip$/i.test(f.name) || /zip/.test(f.type || ""); }
  function isImage(f) { return IMG_EXT.test(f.name) || /^image\/(jpeg|png|webp|gif)$/.test(f.type || ""); }
  async function unzip(file) {
    var out = [];
    var zip = await JSZip.loadAsync(file, {
      decodeFileName: function (bytes) {
        try { return new TextDecoder("euc-kr").decode(bytes); } catch (err) { return new TextDecoder().decode(bytes); }
      }
    });
    var names = Object.keys(zip.files).filter(function (n) {
      var base = n.split("/").pop();
      return !zip.files[n].dir && IMG_EXT.test(n) && n.indexOf("__MACOSX") !== 0 && base.charAt(0) !== ".";
    }).sort();
    for (var i = 0; i < names.length; i++) {
      var blob = await zip.files[names[i]].async("blob");
      var base = names[i].split("/").pop(), ext = base.split(".").pop().toLowerCase();
      out.push(new File([blob], base, { type: MIME[ext] || "image/jpeg" }));
    }
    return out;
  }
  function addJob(file) {
    var j = { id: ++seq, name: file.name, blob: file, status: "queued" };
    jobs.push(j); queue.push(j);
  }
  async function handleFiles(list) {
    var files = Array.prototype.slice.call(list || []);
    if (!files.length) return;
    if (ai === "off") { notice("이 화면에서는 영수증 자동 인식을 쓸 수 없습니다. 오른쪽 입력란에 직접 추가해 주세요."); return; }
    var skipped = 0, badZip = 0;
    for (var i = 0; i < files.length; i++) {
      var f = files[i];
      if (isZip(f)) {
        if (typeof JSZip === "undefined") { badZip++; continue; }
        try { var inner = await unzip(f); if (!inner.length) badZip++; inner.forEach(addJob); } catch (err) { badZip++; }
      } else if (isImage(f)) addJob(f);
      else skipped++;
    }
    renderJobs();
    var parts = [];
    if (skipped) parts.push("지원하지 않는 형식의 파일 " + skipped + "개는 건너뛰었습니다. JPG, PNG, WebP, GIF 이미지나 ZIP 파일을 올려 주세요.");
    if (badZip) parts.push("압축 파일 " + badZip + "개는 열 수 없거나 안에 이미지가 없습니다.");
    notice(parts.join(" "));
    pump();
  }

  var HIDE = { not_granted: 1, sampling_disabled: 1, not_declared: 1, capability_disabled: 1, capability_removed: 1, images_unavailable: 1 };
  function pump() {
    if (ai !== "on" || paused) return;
    while (active < 2 && queue.length) {
      var j = queue.shift();
      if (jobs.indexOf(j) < 0) continue;
      active++;
      analyze(j).then(done, done);
    }
    function done() {
      active--;
      pump();
      if (!active && !queue.length && batchAdded) {
        var n = batchAdded, ym = batchYM;
        batchAdded = 0; batchYM = null;
        if (ym && ym !== selYM) selYM = ym;
        renderAll();
        notice("영수증 " + n + "건을 지출 내역에 추가했습니다. 항목과 금액을 확인해 주세요.");
      }
    }
  }
  async function analyze(j) {
    j.status = "working"; renderJobs();
    try {
      if (imgLimits && imgLimits.maxInputBytes && j.blob.size > imgLimits.maxInputBytes) throw { code: "image_rejected" };
      var out = await sample.json(PROMPT, { images: [j.blob], cache: j.retried ? false : true });
      var ok = out && typeof out === "object" && out.recognized !== false;
      var merchant = ok && out.merchant ? String(out.merchant).trim() : null;
      var date = ok ? toDate(out.date) : null, total = ok ? toAmount(out.total) : null, vat = ok ? toAmount(out.vat) : null;
      if (!ok || (!merchant && !date && total == null)) { j.status = "failed"; renderJobs(); return; }
      dropExamples();
      entries.push({
        id: newId(), date: date, merchant: merchant, total: total, vat: vat,
        cat: CATS.indexOf(out.category) >= 0 ? out.category : guessCat(merchant), catAuto: true, memo: "", src: "receipt"
      });
      save();
      jobs = jobs.filter(function (x) { return x !== j; });
      batchAdded++; if (date) batchYM = date.slice(0, 7);
      renderAll();
    } catch (err) {
      var code = err && err.code;
      if (HIDE[code]) {
        ai = "off"; jobs = []; queue = []; renderJobs();
        notice("영수증 자동 인식이 허용되지 않아 사용할 수 없습니다. 오른쪽 입력란에 직접 추가해 주세요.");
      } else if (code === "rate_limited" || code === "session_expired") {
        paused = true; j.status = "queued"; queue.unshift(j); renderJobs();
        notice(code === "rate_limited" ? "요청이 많아 분석을 잠시 멈췄습니다. 조금 뒤에 이어서 분석해 주세요." : "로그인이 만료되었습니다. 다시 로그인한 뒤 이어서 분석해 주세요.",
          "이어서 분석", function () { paused = false; notice(""); pump(); });
      } else { j.status = "failed"; renderJobs(); }
    }
  }

  var drop = $("drop"), input = $("file");
  input.addEventListener("change", function () { handleFiles(input.files).then(function () { input.value = ""; }); });
  ["dragenter", "dragover"].forEach(function (t) { drop.addEventListener(t, function (ev) { ev.preventDefault(); drop.classList.add("over"); }); });
  ["dragleave", "drop"].forEach(function (t) { drop.addEventListener(t, function (ev) { ev.preventDefault(); drop.classList.remove("over"); }); });
  drop.addEventListener("drop", function (ev) { handleFiles(ev.dataTransfer && ev.dataTransfer.files); });
  window.addEventListener("dragover", function (ev) { ev.preventDefault(); });
  window.addEventListener("drop", function (ev) { ev.preventDefault(); });

  /* ---------- 월 이동, 툴팁 ---------- */
  $("m-prev").addEventListener("click", function () { goMonth(shiftYM(selYM, -1)); });
  $("m-next").addEventListener("click", function () { goMonth(shiftYM(selYM, 1)); });
  $("m-today").addEventListener("click", function () { goMonth(todayStr().slice(0, 7)); });
  $("chart-trend").addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-ym]");
    if (b) { goMonth(b.getAttribute("data-ym")); var again = document.querySelector('[data-ym="' + selYM + '"]'); if (again) again.focus(); }
  });
  var tip = $("tip");
  var tipTimer = null;
  function showTip(ev) {
    var t = ev.target.closest ? ev.target.closest("[data-tip]") : null;
    if (!t) { tip.hidden = true; return; }
    clearTimeout(tipTimer);
    if (ev.pointerType === "touch") tipTimer = setTimeout(function () { tip.hidden = true; }, 2500);
    tip.textContent = t.getAttribute("data-tip");
    tip.hidden = false;
    var w = tip.offsetWidth, x = Math.min(Math.max(8, ev.clientX + 12), window.innerWidth - w - 8);
    tip.style.left = x + "px"; tip.style.top = Math.max(8, ev.clientY - 38) + "px";
  }
  document.addEventListener("pointermove", showTip);
  document.addEventListener("pointerdown", showTip);
  document.addEventListener("pointerleave", function () { tip.hidden = true; });
  window.addEventListener("scroll", function () { tip.hidden = true; }, true);

  /* ---------- 내보내기, 전체 삭제 ---------- */
  $("btn-xlsx").addEventListener("click", async function () {
    var data = entries.filter(function (e) { return !e.ex; }).sort(function (a, b) { return (a.date || "9999") < (b.date || "9999") ? -1 : 1; });
    if (!data.length) { notice("내보낼 지출 내역이 없습니다. 먼저 지출을 추가해 주세요."); return; }
    if (!downloads && !standalone) return;
    var aoa = [["날짜", "사용처", "항목", "총 금액", "부가세", "공급가액", "메모", "입력 방식"]];
    data.forEach(function (e) {
      aoa.push([e.date || NA, e.merchant || NA, e.cat, e.total == null ? NA : e.total, e.vat == null ? NA : e.vat,
        e.total != null && e.vat != null ? e.total - e.vat : NA, e.memo || "", e.src === "receipt" ? "영수증" : "직접 입력"]);
    });
    var payload, filename;
    if (typeof XLSX !== "undefined") {
      var ws = XLSX.utils.aoa_to_sheet(aoa);
      Object.keys(ws).forEach(function (addr) { if (/^[DEF]\d+$/.test(addr) && ws[addr].t === "n") ws[addr].z = "#,##0"; });
      ws["!cols"] = [{ wch: 12 }, { wch: 26 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 26 }, { wch: 10 }];
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "지출 내역");
      payload = XLSX.write(wb, { bookType: "xlsx", type: "array" });
      filename = "가계부_" + todayStr() + ".xlsx";
    } else {
      payload = "﻿" + aoa.map(function (r) { return r.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(","); }).join("\r\n");
      filename = "가계부_" + todayStr() + ".csv";
    }
    if (!downloads) {
      try {
        var blob = new Blob([payload], { type: /\.xlsx$/.test(filename) ? "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" : "text/csv;charset=utf-8" });
        var url = URL.createObjectURL(blob), a = document.createElement("a");
        a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
        notice("");
      } catch (err) { notice("파일을 저장하지 못했습니다. 잠시 뒤에 다시 시도해 주세요."); }
      return;
    }
    try { await downloads.save({ filename: filename, data: payload }); notice(""); }
    catch (err) { if (!(err && err.code === "declined")) notice("파일을 저장하지 못했습니다. 잠시 뒤에 다시 시도해 주세요."); }
  });

  var armed = null;
  $("btn-clear").addEventListener("click", function () {
    var btn = this;
    if (!armed) {
      btn.textContent = "한 번 더 누르면 모두 지웁니다";
      armed = setTimeout(function () { armed = null; btn.textContent = "전체 삭제"; }, 3000);
      return;
    }
    clearTimeout(armed); armed = null; btn.textContent = "전체 삭제";
    entries = []; save(); notice(""); renderAll();
  });

  /* ---------- 시작 ---------- */
  function examples() {
    var now = todayStr(), ym = now.slice(0, 7), dmax = Number(now.slice(8, 10));
    var cur = [[1, "금강식당", 24000], [2, "별빛카페", 9800], [4, "(주)한빛문구", 33000], [5, "공주시내버스", 14500],
      [7, "우리마트", 58200], [9, "새봄약국", 12000], [10, "책나루서점", 27000], [12, "금강식당", 31000]];
    var prev = [[5, "우리마트", 74000], [12, "한길주유소", 60000], [18, "달빛영화관", 28000], [25, "금강식당", 42000]];
    var out = [];
    function add(m, d, name, amt) {
      out.push({ id: newId(), date: m + "-" + pad(d), merchant: name, total: amt, vat: null, cat: guessCat(name), catAuto: true, memo: "", src: "manual", ex: true });
    }
    cur.forEach(function (r) { add(ym, Math.min(r[0], dmax), r[1], r[2]); });
    prev.forEach(function (r) { add(shiftYM(ym, -1), r[0], r[1], r[2]); });
    prev.slice(0, 3).forEach(function (r) { add(shiftYM(ym, -2), r[0], r[1], Math.round(r[2] * 0.8)); });
    return out;
  }

  /* ---------- PWA: 오프라인 저장과 설치 ---------- */
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
  var installEvent = null;
  window.addEventListener("beforeinstallprompt", function (ev) {
    ev.preventDefault(); installEvent = ev; $("btn-install").hidden = false;
  });
  $("btn-install").addEventListener("click", function () {
    if (!installEvent) return;
    installEvent.prompt();
    installEvent.userChoice.then(function () { installEvent = null; $("btn-install").hidden = true; }, function () {});
  });
  window.addEventListener("appinstalled", function () { $("btn-install").hidden = true; });

  entries = load();
  if (entries.length) $("save-state").textContent = "이 브라우저에 저장된 내역 " + entries.length + "건을 불러왔습니다.";
  else entries = examples();
  if (!storageOk) $("save-state").textContent = "이 브라우저에는 저장할 수 없습니다. 엑셀 다운로드로 내역을 보관해 주세요.";
  renderAll();
  if (standalone) {
    $("drop").parentNode.hidden = true;
    document.querySelector(".add").classList.add("noai");
    $("btn-xlsx").hidden = false;
  }

  (async function () {
    try {
      if (window.claude && typeof window.claude.use === "function") {
        var got = await Promise.all([
          window.claude.use("sample").catch(function () { return null; }),
          window.claude.use("downloads").catch(function () { return null; })
        ]);
        downloads = got[1];
        if (got[0]) {
          var caps = await got[0].limits().catch(function () { return null; });
          if (caps && caps.images) { sample = got[0]; imgLimits = caps.images; }
        }
      }
    } catch (err) {}
    ai = sample ? "on" : "off";
    $("btn-xlsx").hidden = !downloads && !standalone;
    if (ai === "off") {
      if (jobs.length) { jobs = []; queue = []; renderJobs(); notice("이 화면에서는 영수증 자동 인식을 쓸 수 없습니다. 오른쪽 입력란에 직접 추가해 주세요."); }
    } else pump();
  })();
})();
</script>
</body>
</html>
