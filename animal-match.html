<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8f6ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="동물 짝꿍">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%}
html,body{overscroll-behavior:none}
@supports (height:100dvh){html{height:100dvh}}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
</style>
<title>동물 짝꿍 찾기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 한 화면 고정 — 위에 제목·점수판, 남은 높이를 3×4 카드판이 채움, 아래 안내·버튼 */
:root{
  --bg:#e8f6ff;          /* 맑은 하늘 */
  --grass:#c9f0d4;       /* 풀밭 띠 */
  --ink:#1f3a5a;         /* 진한 남색 글자 */
  --muted:#5a7390;
  --back:#ff8a5c;        /* 카드 뒷면: 귤색 */
  --back-2:#ffb38f;
  --face:#ffffff;
  --sun:#ffd23f;         /* 강조 노랑 */
  --leaf:#2bb673;        /* 정답 초록 */
  --berry:#e5486b;       /* 오답 빨강 */
  --line:#bcd9ef;
  --font-display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
html{box-sizing:border-box;height:100%}
body{height:100%}
body{
  background:var(--bg);
  background-image:radial-gradient(circle at 12% 8%, #ffffff 0 60px, transparent 61px),
                   radial-gradient(circle at 88% 14%, #ffffff 0 44px, transparent 45px);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:17px;
}
.wrap{
  max-width:640px;margin:0 auto;
  height:100%;box-sizing:border-box;
  padding-block:14px 16px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;flex-direction:column;gap:12px;
}
.stage{
  flex:1;min-height:320px;container-type:size;
  display:flex;align-items:center;justify-content:center;
}
header{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
h1{
  font-family:var(--font-display);font-weight:400;
  font-size:clamp(1.8rem,7vw,2.6rem);margin:0;line-height:1.1;
  color:var(--ink);text-wrap:balance;
}
h1 span{color:var(--back)}
.sub{margin:0;color:var(--muted);font-size:1.05rem}

/* 점수판 */
.board{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  background:var(--face);border:3px solid var(--line);border-radius:20px;
  padding:10px;
}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px}
.stat .label{font-size:.95rem;color:var(--muted);letter-spacing:.02em}
.stat .value{
  font-family:var(--font-display);font-size:2rem;line-height:1;
  font-variant-numeric:tabular-nums;color:var(--ink);
}
.stat.score .value{color:var(--back)}
.bump{animation:bump .45s ease}
@keyframes bump{40%{transform:scale(1.35)}}

/* 버튼 줄 */
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button{font-family:var(--font-display);cursor:pointer}
.btn{
  font-size:1.25rem;border:none;border-radius:999px;
  padding:10px 22px;background:var(--sun);color:var(--ink);
  box-shadow:0 4px 0 #d9a900;transition:transform .1s, box-shadow .1s;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #d9a900}
.btn.ghost{background:var(--face);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.ghost:active{box-shadow:0 1px 0 var(--line)}
button:focus-visible{outline:4px solid var(--ink);outline-offset:3px}

/* 카드 판 */
.grid{
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);
  gap:clamp(8px,2.4vw,14px);
  background:var(--grass);border-radius:24px;padding:clamp(10px,3vw,16px);
  box-sizing:border-box;aspect-ratio:3/5;max-width:100%;
  width:100%;max-width:460px;
  width:min(100cqw, calc(100cqh * 0.6), 460px);
}
.card{
  width:100%;height:100%;min-height:0;container-type:inline-size;
  perspective:800px;background:none;border:none;padding:0;
}
.inner{
  position:relative;width:100%;height:100%;
  transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,1.4,.5,1);
}
.card.flipped .inner,.card.matched .inner{transform:rotateY(180deg)}
.side{
  position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
}
.back{
  background:
    radial-gradient(circle, var(--back-2) 0 4px, transparent 5px) 0 0/18px 18px,
    var(--back);
  border:4px solid #fff;box-shadow:0 4px 0 #d9663a;
  color:#fff;font-family:var(--font-display);font-size:clamp(1.8rem,40cqi,3.4rem);
  text-shadow:0 2px 0 #d9663a;
}
.front{
  background:var(--face);transform:rotateY(180deg);
  border:4px solid var(--line);box-shadow:0 4px 0 var(--line);
}
.front .emoji{font-size:clamp(2rem,46cqi,4.4rem);line-height:1}
.front .name{font-family:var(--font-display);font-size:clamp(1rem,15cqi,1.5rem);color:var(--ink)}
.card:not(.flipped):not(.matched):hover .inner{transform:translateY(-4px)}
.card.matched .front{border-color:var(--leaf);box-shadow:0 4px 0 var(--leaf);background:#eafbf1}
.card.matched .inner{animation:hop .8s cubic-bezier(.3,1.6,.5,1) .05s}
@keyframes hop{
  0%{transform:rotateY(180deg) scale(1)}
  30%{transform:rotateY(180deg) translateY(-22px) scale(1.3) rotate(-8deg)}
  55%{transform:rotateY(180deg) translateY(-8px) scale(1.18) rotate(7deg)}
  80%{transform:rotateY(180deg) scale(.96) rotate(-2deg)}
  100%{transform:rotateY(180deg) scale(1)}
}
.card{position:relative}
.card.glow::after{
  content:"";position:absolute;inset:-10px;border-radius:24px;pointer-events:none;
  border:6px solid var(--sun);box-shadow:0 0 30px 8px var(--sun);
  animation:ring .8s ease-out forwards;
}
@keyframes ring{from{transform:scale(.8);opacity:1}to{transform:scale(1.45);opacity:0}}
.pop{
  position:fixed;z-index:25;pointer-events:none;transform:translate(-50%,-50%);
  font-family:var(--font-display);font-size:clamp(2.4rem,9vw,3.6rem);color:var(--back);
  -webkit-text-stroke:3px #fff;paint-order:stroke fill;text-shadow:0 4px 0 #d9663a;
  animation:rise 1.1s ease-out forwards;white-space:nowrap;
}
.pop small{display:block;font-size:.5em;color:var(--leaf);text-shadow:0 3px 0 #1d8a55;text-align:center}
@keyframes rise{
  0%{transform:translate(-50%,-30%) scale(.3);opacity:0}
  25%{transform:translate(-50%,-60%) scale(1.35);opacity:1}
  45%{transform:translate(-50%,-70%) scale(1)}
  100%{transform:translate(-50%,-160%) scale(1);opacity:0}
}
.grid.flash{animation:flash .5s ease}
@keyframes flash{30%{background:#fff6c7;box-shadow:0 0 0 6px var(--sun)}}
.card.wrong .front{border-color:var(--berry);box-shadow:0 4px 0 var(--berry)}
.card.wrong .inner{animation:shake .4s ease}
@keyframes shake{25%{transform:rotateY(180deg) translateX(-6px)}75%{transform:rotateY(180deg) translateX(6px)}}

.message{
  min-height:1.6em;text-align:center;margin:0;
  font-family:var(--font-display);font-size:1.3rem;color:var(--ink);
}

/* 완료 안내 */
.overlay{
  position:fixed;inset:0;z-index:20;
  display:flex;align-items:center;justify-content:center;
  background:rgba(232,246,255,.7);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.panel{
  background:var(--face);border:4px solid var(--sun);border-radius:28px;
  padding:24px 28px;max-width:360px;width:100%;
  display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;
  box-shadow:0 8px 0 #d9a900;animation:pop .5s cubic-bezier(.3,1.6,.5,1);
}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.panel .big{font-size:3.4rem;line-height:1}
.panel h2{font-family:var(--font-display);font-weight:400;font-size:2rem;margin:0}
.panel p{margin:0;font-size:1.15rem;color:var(--muted)}
.panel strong{font-family:var(--font-display);font-weight:400;color:var(--back);font-size:1.5rem}
.stars{font-size:2rem;letter-spacing:.1em}

canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}

@media (max-width:420px){
  .wrap{gap:10px}
  .board{padding:8px;border-radius:16px}
  .stat .label{font-size:.9rem}
  .stat .value{font-size:1.6rem}
  .btn{font-size:1.1rem;padding:8px 18px}
  .side{border-width:3px;border-radius:12px}
  .message{font-size:1.15rem}
}
@media (max-height:720px){
  .sub{display:none}
  .wrap{padding-block:10px 12px;gap:8px}
}
@media (prefers-reduced-motion:reduce){
  .inner{transition:none}
  .card.matched .inner,.card.wrong .inner,.bump,.panel,.grid.flash{animation:none}
  .card.glow::after{display:none}
  .pop{animation:none;opacity:1}
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>동물 <span>짝꿍</span> 찾기</h1>
    <p class="sub">카드 두 장을 뒤집어 같은 동물 찾기</p>
  </header>

  <section class="board" aria-label="점수판">
    <div class="stat score"><span class="label">점수</span><span class="value" id="score">0</span></div>
    <div class="stat"><span class="label">찾은 짝</span><span class="value" id="pairs">0/6</span></div>
    <div class="stat"><span class="label">뒤집은 횟수</span><span class="value" id="moves">0</span></div>
  </section>

  <div class="stage">
    <main class="grid" id="grid" aria-label="카드 놀이판"></main>
  </div>

  <p class="message" id="message" aria-live="polite">카드를 눌러 시작!</p>

  <div class="controls">
    <button class="btn" id="restart" type="button">🔄 다시 시작</button>
    <button class="btn ghost" id="sound" type="button" aria-pressed="true">🔊 소리 켜짐</button>
  </div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="panel" role="dialog" aria-labelledby="doneTitle">
    <div class="big">🎉</div>
    <h2 id="doneTitle">모두 찾았어요!</h2>
    <div class="stars" id="stars">⭐⭐⭐</div>
    <p>최종 점수 <strong id="finalScore">0</strong>점</p>
    <p id="finalMoves">8번 만에 완성</p>
    <button class="btn" id="again" type="button">🔄 한 번 더 하기</button>
  </div>
</div>

<canvas id="fx" aria-hidden="true"></canvas>

<script>
(() => {
  const ANIMALS = [
    {e:"🐶", n:"강아지"}, {e:"🐱", n:"고양이"}, {e:"🐰", n:"토끼"},
    {e:"🐼", n:"판다"},   {e:"🦁", n:"사자"},   {e:"🐧", n:"펭귄"}
  ];
  const MATCH_POINTS = 10, MISS_PENALTY = 1, FLIP_BACK_MS = 1000;

  const $ = id => document.getElementById(id);
  const grid = $("grid"), scoreEl = $("score"), pairsEl = $("pairs"), movesEl = $("moves");
  const msgEl = $("message"), overlay = $("overlay");

  let first = null, second = null, lock = false;
  let score = 0, pairs = 0, moves = 0, combo = 0;

  /* ---------- 효과음 (Web Audio, 외부 파일 없음) ---------- */
  let ctx = null, soundOn = true;
  function audio(){
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return null; } }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function tone(freq, start, dur, type="sine", vol=.18){
    const a = audio(); if (!a || !soundOn) return;
    const t = a.currentTime + start;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + .02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + dur + .05);
  }
  const sfx = {
    flip(){ tone(660, 0, .08, "triangle", .12); },
    match(){
      /* 딩-동-댕! 올라가는 3음 + 반짝이는 고음 */
      tone(1047, 0,   .14, "triangle", .2);
      tone(1319, .07, .14, "triangle", .2);
      tone(1568, .14, .32, "triangle", .22);
      tone(2093, .14, .32, "sine", .08);
      tone(3136, .2,  .12, "sine", .05);
      tone(3520, .26, .12, "sine", .04);
    },
    miss(){ tone(220, 0, .18, "square", .07); tone(185, .15, .22, "square", .07); },
    win(){ [523,659,784,1047,784,1047].forEach((f,i)=>tone(f, i*.13, .3, "triangle", .16)); }
  };

  /* ---------- 게임 ---------- */
  function shuffle(arr){
    for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [arr[i],arr[j]] = [arr[j],arr[i]]; }
    return arr;
  }

  function build(){
    grid.innerHTML = "";
    const deck = shuffle([...ANIMALS, ...ANIMALS].map(a => ({...a})));
    deck.forEach((a, i) => {
      const b = document.createElement("button");
      b.className = "card"; b.type = "button"; b.id = "card-" + i;
      b.dataset.key = a.n;
      b.setAttribute("aria-label", "뒤집힌 카드");
      b.innerHTML =
        '<div class="inner">' +
          '<div class="side back">?</div>' +
          '<div class="side front"><span class="emoji">' + a.e + '</span><span class="name">' + a.n + '</span></div>' +
        '</div>';
      b.addEventListener("click", () => pick(b));
      grid.appendChild(b);
    });
  }

  function setStat(el, val){
    el.textContent = val;
    el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump");
  }

  function pick(card){
    audio();
    if (lock || card === first || card.classList.contains("matched") || card.classList.contains("flipped")) return;
    card.classList.add("flipped");
    card.setAttribute("aria-label", card.dataset.key);
    sfx.flip();

    if (!first) { first = card; msgEl.textContent = "하나 더 골라 보세요"; return; }
    second = card; lock = true;
    moves++; setStat(movesEl, moves);

    if (first.dataset.key === second.dataset.key) {
      combo++;
      const gained = MATCH_POINTS + (combo > 1 ? (combo - 1) * 5 : 0);
      score += gained; pairs++;
      setTimeout(() => {
        [first, second].forEach(c => { c.classList.remove("flipped"); c.classList.add("matched"); c.disabled = true; });
        sfx.match();
        celebrate(first, second, gained, combo);
        setStat(scoreEl, score); setStat(pairsEl, pairs + "/" + ANIMALS.length);
        msgEl.textContent = combo > 1
          ? first.dataset.key + " 짝 성공! 연속 " + combo + "번 +" + gained + "점"
          : first.dataset.key + " 짝 성공! +" + gained + "점";
        first = second = null; lock = false;
        if (pairs === ANIMALS.length) finish();
      }, 350);
    } else {
      combo = 0;
      setTimeout(() => {
        first.classList.add("wrong"); second.classList.add("wrong");
        sfx.miss();
        msgEl.textContent = "앗, 다른 동물! 잘 기억해 두기";
      }, 350);
      setTimeout(() => {
        [first, second].forEach(c => { c.classList.remove("flipped", "wrong"); c.setAttribute("aria-label", "뒤집힌 카드"); });
        if (score >= MISS_PENALTY) { score -= MISS_PENALTY; setStat(scoreEl, score); }
        first = second = null; lock = false;
      }, 350 + FLIP_BACK_MS);
    }
  }

  function finish(){
    const best = ANIMALS.length;
    const stars = moves <= best + 3 ? 3 : moves <= best + 7 ? 2 : 1;
    $("stars").textContent = "⭐".repeat(stars) + "☆".repeat(3 - stars);
    $("finalScore").textContent = score;
    $("finalMoves").textContent = moves + "번 만에 완성";
    msgEl.textContent = "모든 짝 완성!";
    setTimeout(() => {
      sfx.win();
      fireworks();
      overlay.hidden = false;
      $("again").focus();
    }, 500);
  }

  function restart(){
    overlay.hidden = true;
    first = second = null; lock = false;
    score = pairs = moves = combo = 0;
    scoreEl.textContent = 0; pairsEl.textContent = "0/" + ANIMALS.length; movesEl.textContent = 0;
    msgEl.textContent = "카드를 눌러 시작!";
    build();
  }

  $("restart").addEventListener("click", () => { audio(); restart(); });
  $("again").addEventListener("click", restart);
  $("sound").addEventListener("click", e => {
    soundOn = !soundOn;
    e.currentTarget.textContent = soundOn ? "🔊 소리 켜짐" : "🔇 소리 꺼짐";
    e.currentTarget.setAttribute("aria-pressed", String(soundOn));
    if (soundOn) sfx.flip();
  });

  /* ---------- 폭죽 파티클 ---------- */
  const cv = $("fx"), g2 = cv.getContext("2d");
  const COLORS = ["#ff8a5c","#ffd23f","#2bb673","#4aa8ff","#e5486b","#b07cff"];
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  let parts = [], running = false;

  function resize(){
    const d = window.devicePixelRatio || 1;
    cv.width = innerWidth * d; cv.height = innerHeight * d;
    g2.setTransform(d,0,0,d,0,0);
  }
  addEventListener("resize", resize); resize();

  function spawn(x, y, n, power){
    for (let i = 0; i < n; i++) {
      const ang = Math.random() * Math.PI * 2, sp = power * (0.4 + Math.random() * 0.8);
      parts.push({
        x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - power * .3,
        life: 1, decay: .012 + Math.random() * .012,
        size: 4 + Math.random() * 5, rot: Math.random() * 6, vr: (Math.random() - .5) * .3,
        color: COLORS[(Math.random() * COLORS.length) | 0], shape: Math.random() < .5 ? 0 : 1
      });
    }
    if (!running) { running = true; requestAnimationFrame(tick); }
  }
  function burst(el, n){
    if (reduce) return;
    const r = el.getBoundingClientRect();
    spawn(r.left + r.width / 2, r.top + r.height / 2, n, 7);
  }
  function celebrate(a, b, gained, combo){
    [a, b].forEach(c => {
      c.classList.remove("glow"); void c.offsetWidth; c.classList.add("glow");
      setTimeout(() => c.classList.remove("glow"), 850);
      burst(c, 45);
    });
    grid.classList.remove("flash"); void grid.offsetWidth; grid.classList.add("flash");
    const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
    const pop = document.createElement("div");
    pop.className = "pop";
    pop.style.left = ((ra.left + ra.right + rb.left + rb.right) / 4) + "px";
    pop.style.top = ((ra.top + ra.bottom + rb.top + rb.bottom) / 4) + "px";
    const cheers = ["딩동댕!", "정답!", "최고!", "짝짝짝!"];
    pop.innerHTML = "+" + gained + (combo > 1 ? "<small>" + combo + "연속!</small>" : "<small>" + cheers[(Math.random()*cheers.length)|0] + "</small>");
    document.body.appendChild(pop);
    setTimeout(() => pop.remove(), 1150);
  }
  function fireworks(){
    if (reduce) return;
    for (let k = 0; k < 7; k++) {
      setTimeout(() => {
        spawn(innerWidth * (0.15 + Math.random() * 0.7), innerHeight * (0.15 + Math.random() * 0.35), 70, 8);
      }, k * 280);
    }
  }
  function tick(){
    g2.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.life > 0);
    for (const p of parts) {
      p.vy += .15; p.vx *= .99; p.vy *= .99;
      p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= p.decay;
      g2.save(); g2.globalAlpha = Math.max(p.life, 0); g2.fillStyle = p.color;
      g2.translate(p.x, p.y); g2.rotate(p.rot);
      if (p.shape) g2.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      else { g2.beginPath(); g2.arc(0, 0, p.size / 2, 0, Math.PI * 2); g2.fill(); }
      g2.restore();
    }
    if (parts.length) requestAnimationFrame(tick);
    else { running = false; g2.clearRect(0, 0, innerWidth, innerHeight); }
  }

  build();
})();
</script>
