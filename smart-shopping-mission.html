<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="예산 안에서 장을 보고, 내가 고른 이유를 적는 우리 반 장보기 활동">
<title>우리 반 스마트 장보기 미션</title>
<style>
:root{--ink:#20251d;--muted:#526050;--green:#195941;--paper:#fffdf5;--line:#ddd9c8;--lime:#e5efac}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,"Malgun Gothic",sans-serif}
button,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.48}
button:focus-visible,textarea:focus-visible{outline:3px solid #497950;outline-offset:3px}
.site-header{border-bottom:1px solid var(--line);background:#f5f2e4}
.bar,main{max-width:1140px;margin:auto;padding-inline:clamp(16px,4vw,48px)}
.bar{display:flex;align-items:center;gap:12px;min-height:72px;font-weight:800}
.mark{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:var(--lime)}
main{padding-top:clamp(24px,5vw,60px);padding-bottom:48px}
[hidden]{display:none!important}
.hero{position:relative;overflow:hidden;padding:clamp(24px,5vw,56px);border-radius:28px;background:#e8efc8}
.hero h1{max-width:650px;font-size:clamp(32px,6vw,64px);letter-spacing:-.065em;line-height:1.13;margin:0 0 17px}
.hero p{margin:0;color:#3d503b;max-width:480px}
.hero-art{position:absolute;right:7%;top:22%;font-size:clamp(88px,14vw,166px);transform:rotate(-12deg);line-height:1}
h1,h2,p{overflow-wrap:anywhere}
h1,h2{line-height:1.24;letter-spacing:-.04em}
h1{font-size:clamp(30px,5vw,48px);margin:8px 0}
h2{font-size:25px;margin-top:0}
.section-head{margin:34px 0 14px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
.mission,.item,.panel,.receipt{border:1px solid var(--line);border-radius:19px;background:white}
.mission{text-align:left;padding:17px;color:inherit;transition:transform .15s,border-color .15s}
.mission:hover{transform:translateY(-3px);border-color:var(--green)}
.mission .art{display:grid;place-items:center;border-radius:12px;height:103px;font-size:58px;background:var(--tint)}
.mission strong{display:block;font-size:clamp(17px,2.2vw,22px);margin-top:12px}
.mission small{color:var(--green);font-weight:800;font-size:15px}
.arrow{float:right}
.muted{color:var(--muted)}
.back,.secondary,.primary{border-radius:10px;padding:9px 15px;font-weight:750}
.back{background:none;color:var(--green);border:0;padding-left:0}
.secondary{background:white;color:var(--green);border:1px solid #93a997}
.primary{background:var(--green);color:white;border:1px solid var(--green)}
.shop-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,320px);gap:22px;align-items:start;margin-top:22px}
.products{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(701px <= width < 1024px){.products{grid-template-columns:repeat(3,minmax(0,1fr))}}
.item{display:flex;flex-direction:column;padding:12px}
.item.selected{border-color:#55876a;background:#fbfff5}
.item-art{display:grid;place-items:center;font-size:42px;height:75px;background:#f5f2e5;border-radius:11px}
.item strong{display:block;margin-top:8px}
.controls{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:auto;padding-top:9px}
.controls button{width:40px;height:40px;border-radius:9px;border:1px solid #a8bca9;background:#eff5e8;color:#174e38;font-size:23px;line-height:1}
.controls output{font-weight:800;font-variant-numeric:tabular-nums}
.panel{position:sticky;top:12px;padding:17px}
.metric{display:flex;justify-content:space-between;gap:8px;margin:5px 0}
.metric strong,.money{font-variant-numeric:tabular-nums;white-space:nowrap}
.balance{background:#edf3d8;padding:7px 10px;border-radius:8px}
.over .balance,.warning{color:#a52d20;background:#ffede7}
.warning{padding:8px 10px;border-radius:8px;font-size:14px}
.cart{margin:10px 0;padding:9px 0;border-block:1px dashed var(--line)}
.cart p{margin:4px 0}
.panel .primary{width:100%;margin-top:8px}
.receipt{max-width:720px;margin:16px auto;padding:clamp(16px,4vw,34px)}
.receipt h2{margin-bottom:8px}
table{width:100%;border-collapse:collapse;margin:15px 0}
th,td{padding:8px 4px;text-align:left;border-bottom:1px solid var(--line)}
th:nth-child(n+2),td:nth-child(n+2){text-align:right;white-space:nowrap}
label{display:block;font-weight:800;margin-top:22px}
textarea{width:100%;min-height:138px;border:1px solid #889d8d;border-radius:10px;padding:11px;resize:vertical;color:inherit;background:#fffefa}
.hint{font-size:14px;margin:4px 0 8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;max-width:720px;margin:14px auto}
.print-reason{display:none;white-space:pre-wrap;overflow-wrap:anywhere}
@media(max-width:820px){.hero-art{right:5%;top:32%;font-size:100px}.hero h1,.hero p{max-width:75%}}
@media(max-width:700px){.shop-layout{display:flex;flex-direction:column;gap:13px}.panel{order:-1;z-index:2;width:100%;top:0;padding:11px 13px;box-shadow:0 4px 12px #20251d12}.panel h2{font-size:19px;margin-bottom:2px}.panel .cart{display:none}.panel .metric{margin:2px 0}.panel .primary{margin-top:4px}.products{width:100%;grid-template-columns:repeat(2,minmax(0,1fr))}.warning{margin:4px 0}}
@media(max-width:520px){.hero-art{display:none}.hero h1,.hero p{max-width:none}.missions{grid-template-columns:1fr}.mission{display:grid;grid-template-columns:76px 1fr;column-gap:12px;align-items:center}.mission .art{grid-row:span 2;height:65px;font-size:38px}.mission strong{margin:0;align-self:end}.mission small{align-self:start}}
@media print{body{background:white;color:black}.site-header,.no-print,textarea,.hint{display:none!important}main{padding:0}.receipt{border:0;margin:0;padding:0;max-width:none}.print-reason{display:block}.receipt h1{font-size:27px}.receipt tr{break-inside:avoid}}
</style>
</head>
<body>
<header class="site-header"><div class="bar"><span class="mark" aria-hidden="true">🛒</span> 우리 반 스마트 장보기 미션</div></header>
<main>
<section id="start">
  <div class="hero"><h1 tabindex="-1">우리 반 스마트<br>장보기 미션</h1><p>예산 안에서 필요한 물건을 고르고, 왜 그렇게 골랐는지 내 말로 설명해 봐요.</p><span class="hero-art" aria-hidden="true">🛒</span></div>
  <h2 class="section-head">오늘의 미션 고르기</h2>
  <div id="missions" class="grid missions"></div>
</section>
<section id="shop" hidden>
  <button id="back-missions" class="back" type="button">← 미션 선택</button>
  <h1 id="shop-title" tabindex="-1"></h1>
  <p id="shop-context" class="muted"></p>
  <div class="shop-layout">
    <div id="products" class="grid products" aria-label="상품 진열대"></div>
    <aside id="budget-panel" class="panel" aria-labelledby="cart-title">
      <h2 id="cart-title">장바구니</h2>
      <div class="metric"><span>제한 예산</span><strong id="budget"></strong></div>
      <div id="budget-live" aria-live="polite" aria-atomic="true">
        <div class="metric"><span>사용 금액</span><strong id="spent"></strong></div>
        <div class="metric balance"><span id="balance-label">남은 잔액</span><strong id="balance"></strong></div>
        <div class="metric"><span>담은 물건</span><strong id="count"></strong></div>
        <p id="warning" class="warning" hidden>예산을 넘었어요. 물건을 빼거나 수량을 줄여 보세요.</p>
      </div>
      <div id="cart" class="cart"></div>
      <button id="submit" class="primary" type="button" disabled>제출하기</button>
    </aside>
  </div>
</section>
<section id="result" hidden>
  <article class="receipt">
    <p class="muted">장보기 영수증</p>
    <h1 id="result-title" tabindex="-1"></h1>
    <table><thead><tr><th scope="col">품목</th><th scope="col">수량</th><th scope="col">금액</th></tr></thead><tbody id="receipt-items"></tbody></table>
    <div class="metric"><span>제한 예산</span><strong id="receipt-budget"></strong></div>
    <div class="metric"><span>사용 금액</span><strong id="receipt-spent"></strong></div>
    <div class="metric balance"><span>남은 잔액</span><strong id="receipt-balance"></strong></div>
    <label for="reason">이 물건들을 선택한 이유를 작성해 주세요.</label>
    <p id="reason-hint" class="hint muted">꼭 필요했던 물건은 무엇인가요? 예산을 맞추려고 어떤 선택을 했나요?</p>
    <textarea id="reason" aria-describedby="reason-hint" placeholder="내가 고른 물건과 그 이유를 적어 봐요."></textarea>
    <p id="print-reason" class="print-reason"></p>
  </article>
  <div class="actions no-print">
    <button id="edit" class="secondary" type="button">← 장바구니 수정</button>
    <button id="print" class="primary" type="button" disabled>PDF로 저장</button>
    <button id="restart" class="secondary" type="button">새 미션</button>
  </div>
</section>
</main>
<script>
const missions = [
  {
    title: '카레 만들기', emoji: '🍛', tint: '#f9eac1', budget: 15000,
    context: '카레를 만들 재료를 골라요. 어떤 재료를 꼭 넣고 싶나요?',
    items: [['🟨','카레 가루 1봉',2600],['🥔','감자 1개',850],['🥕','당근 1개',950],['🧅','양파 1개',750],['🥩','카레용 돼지고기 1팩',5200],['🍄','버섯 1팩',2400],['🍚','즉석밥 1개',1700],['🥦','브로콜리 1개',2900],['🧀','치즈 1팩',3800],
      ['🍗','카레용 닭고기 1팩',4500],['🫘','병아리콩 1캔',2300],['🍠','고구마 1개',1100],['🫑','파프리카 1개',1600],['🍆','가지 1개',1300],['🍅','토마토 1개',1200],['🥛','우유 1팩',1900]]
  },
  {
    title: '여름캠핑 준비하기', emoji: '⛺', tint: '#dcebd5', budget: 30000,
    context: '여름 캠핑에 가져갈 물건을 골라요. 날씨와 야외 활동을 생각해 봐요.',
    items: [['💧','생수 1병',900],['🔦','손전등 1개',6500],['🧴','자외선 차단제 1개',8500],['🦟','모기 기피제 1개',6800],['🧻','물티슈 1팩',2200],['🧢','모자 1개',7900],['🧊','얼음 1봉',2600],['🍪','과자 1봉',2000],['🪭','휴대용 부채 1개',1700],
      ['🌀','휴대용 선풍기 1개',9900],['🏮','캠핑 랜턴 1개',11900],['🧴','모기 기피 패치 1팩',3900],['☔','우비 1개',2800],['🟩','돗자리 1장',6900],['🥤','보냉 물병 1개',7400],['🧺','보냉 가방 1개',8900]]
  },
  {
    title: '친구 생일파티 준비하기', emoji: '🎂', tint: '#f5dfe4', budget: 25000,
    context: '친구의 생일을 축하할 물건을 골라요. 파티에 무엇이 필요할까요?',
    items: [['🎂','미니 케이크 1개',11500],['🕯️','생일 초 1팩',1500],['🎈','풍선 1팩',2300],['🧃','주스 1개',1200],['🍕','미니 피자 1개',5800],['🍿','팝콘 1봉',1800],['💌','생일 카드 1장',2000],['🍽️','종이접시 1팩',2400],['🎉','파티 장식 1세트',4200],
      ['🧁','컵케이크 1개',2400],['🍩','도넛 1개',1500],['🥪','샌드위치 1개',2900],['🍇','컵과일 1개',2400],['🫧','탄산수 1병',950],['🥤','종이컵 1팩',1600],['🎊','생일 가랜드 1개',2800]]
  }
];
const get = id => document.getElementById(id);
const won = value => value.toLocaleString('ko-KR') + '원';
const screens = ['start', 'shop', 'result'];
let mission;
let quantities = [];
let controls = [];

function show(screen) {
  for (const name of screens) get(name).hidden = name !== screen;
  window.scrollTo(0, 0);
  get(screen).querySelector('h1').focus({preventScroll:true});
}

function selected() {
  return mission.items.map(([, name, price], index) => ({
    name, quantity: quantities[index], total: price * quantities[index]
  })).filter(item => item.quantity > 0);
}

function totals() {
  const items = selected();
  const spent = items.reduce((sum, item) => sum + item.total, 0);
  const count = items.reduce((sum, item) => sum + item.quantity, 0);
  return {items, spent, count, balance: mission.budget - spent};
}

function choose(index) {
  mission = missions[index];
  quantities = mission.items.map(() => 0);
  get('reason').value = '';
  get('shop-title').textContent = mission.title;
  get('shop-context').textContent = mission.context;
  get('budget').textContent = won(mission.budget);
  get('products').innerHTML = mission.items.map(([emoji, name, price]) => `
    <article class="item">
      <div class="item-art" aria-hidden="true">${emoji}</div>
      <strong>${name}</strong><span class="muted">${won(price)}</span>
      <div class="controls">
        <button type="button" aria-label="${name} 수량 줄이기">−</button>
        <output aria-label="${name} 수량">0</output>
        <button type="button" aria-label="${name} 수량 늘리기">+</button>
      </div>
    </article>`).join('');
  controls = [...get('products').children].map((card, itemIndex) => {
    const [minus, plus] = card.querySelectorAll('button');
    minus.onclick = () => changeQuantity(itemIndex, -1);
    plus.onclick = () => changeQuantity(itemIndex, 1);
    return {card, minus, output: card.querySelector('output')};
  });
  updateBudget();
  show('shop');
}

function changeQuantity(index, delta) {
  quantities[index] = Math.max(0, quantities[index] + delta);
  updateBudget();
}

function updateBudget() {
  const {items, spent, count, balance} = totals();
  const over = balance < 0;
  get('spent').textContent = won(spent);
  get('balance-label').textContent = over ? '초과 금액' : '남은 잔액';
  get('balance').textContent = won(Math.abs(balance));
  get('count').textContent = count + '개';
  get('warning').hidden = !over;
  get('budget-panel').classList.toggle('over', over);
  get('submit').disabled = over || count === 0;
  get('cart').innerHTML = items.length ? items.map(item =>
    `<p class="metric"><span>${item.name} × ${item.quantity}</span><strong>${won(item.total)}</strong></p>`
  ).join('') : '<p class="muted">아직 담은 물건이 없어요.</p>';
  controls.forEach(({card, minus, output}, index) => {
    const quantity = quantities[index];
    minus.disabled = quantity === 0;
    output.value = quantity;
    card.classList.toggle('selected', quantity > 0);
  });
}

function updateReason() {
  const reason = get('reason').value.trim();
  get('print-reason').textContent = reason;
  get('print').disabled = !reason;
}

get('missions').innerHTML = missions.map(mission => `
  <button class="mission" type="button" style="--tint:${mission.tint}">
    <span class="art" aria-hidden="true">${mission.emoji}</span>
    <strong>${mission.title}</strong>
    <small>예산 ${won(mission.budget)} <span class="arrow" aria-hidden="true">→</span></small>
  </button>`).join('');
[...get('missions').children].forEach((button, index) => { button.onclick = () => choose(index); });
get('back-missions').onclick = () => show('start');
get('restart').onclick = () => show('start');
get('edit').onclick = () => show('shop');
get('submit').onclick = () => {
  const {items, spent, balance} = totals();
  if (!items.length || balance < 0) return;
  get('result-title').textContent = mission.title;
  get('receipt-items').innerHTML = items.map(item => `
    <tr><th scope="row">${item.name}</th><td>${item.quantity}개</td><td>${won(item.total)}</td></tr>`).join('');
  get('receipt-budget').textContent = won(mission.budget);
  get('receipt-spent').textContent = won(spent);
  get('receipt-balance').textContent = won(balance);
  updateReason();
  show('result');
};
get('reason').addEventListener('input', updateReason);
get('print').onclick = () => window.print();
</script>
</body>
</html>
