<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="감정 버튼을 누르면 그 마음에 맞는 명언을 보여주는 웹 앱">
<meta name="theme-color" content="#F6F7F9">
<title>마음 한 문장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
button,.tab,.emo{touch-action:manipulation;-webkit-tap-highlight-color:transparent}

/* Layout: 한 장짜리 필사 노트 — 감정 버튼 → 큰 문장 카드 → 접히는 목록 관리 */
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --ink:#1F2430; --muted:#5E6575; --line:#DDE1E8;
  --joy:#C98A0B; --joy-soft:#FFF5DC;
  --sad:#3B6FB6; --sad-soft:#E8F0FB;
  --tired:#3F8A63; --tired-soft:#E5F3EA;
  --anx:#7A5CC2; --anx-soft:#EFEAFB;
  --danger:#C23B3B;
  --accent:var(--joy); --accent-soft:var(--joy-soft);
  --f-quote:"Gowun Batang","Nanum Myeongjo","Batang",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15181F; --surface:#1E222B; --ink:#ECEEF3; --muted:#A3A9B6; --line:#323845;
  --joy:#F0BC4C; --joy-soft:#2F2815; --sad:#82AEEB; --sad-soft:#1A2638;
  --tired:#7CC79D; --tired-soft:#17291F; --anx:#B49CF0; --anx-soft:#251E37; --danger:#F07C7C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15181F; --surface:#1E222B; --ink:#ECEEF3; --muted:#A3A9B6; --line:#323845;
  --joy:#F0BC4C; --joy-soft:#2F2815; --sad:#82AEEB; --sad-soft:#1A2638;
  --tired:#7CC79D; --tired-soft:#17291F; --anx:#B49CF0; --anx-soft:#251E37; --danger:#F07C7C; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 56px}
body[data-emo="joy"]{--accent:var(--joy);--accent-soft:var(--joy-soft)}
body[data-emo="sad"]{--accent:var(--sad);--accent-soft:var(--sad-soft)}
body[data-emo="tired"]{--accent:var(--tired);--accent-soft:var(--tired-soft)}
body[data-emo="anx"]{--accent:var(--anx);--accent-soft:var(--anx-soft)}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-direction:column;gap:4px}
h1{font-family:var(--f-quote);font-weight:700;font-size:clamp(28px,5vw,36px);margin:0;letter-spacing:-.01em}
.sub{margin:0;color:var(--muted);font-size:17px}
h2{font-size:15px;font-weight:600;letter-spacing:.06em;color:var(--muted);margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.emos{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:620px){.emos{grid-template-columns:repeat(2,1fr)}}
.emo{--c:var(--joy);--cs:var(--joy-soft);border:2px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:14px;padding:16px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;
  transition:border-color .15s,background .15s,transform .15s}
.emo[data-k="sad"]{--c:var(--sad);--cs:var(--sad-soft)}
.emo[data-k="tired"]{--c:var(--tired);--cs:var(--tired-soft)}
.emo[data-k="anx"]{--c:var(--anx);--cs:var(--anx-soft)}
.emo .dot{width:14px;height:14px;border-radius:50%;background:var(--c)}
.emo b{font-size:18px;font-weight:600}
.emo small{color:var(--muted);font-size:14px}
.emo:hover{border-color:var(--c);transform:translateY(-2px)}
.emo[aria-pressed="true"]{border-color:var(--c);background:var(--cs)}

.card{background:var(--accent-soft);border-radius:20px;padding:clamp(28px,6vw,52px);display:flex;flex-direction:column;gap:22px;
  border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);transition:background .3s}
.tag{align-self:flex-start;font-size:14px;font-weight:600;color:var(--accent);letter-spacing:.04em}
.mark{font-family:var(--f-quote);font-size:72px;line-height:.5;color:var(--accent);height:28px;margin:0}
blockquote{margin:0;font-family:var(--f-quote);font-size:clamp(22px,3.6vw,30px);line-height:1.65;text-wrap:balance;word-break:keep-all}
.who{font-size:17px;color:var(--muted);margin:0}
.who::before{content:"— "}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.count{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.btn{border:none;background:var(--accent);color:var(--surface);font-weight:600;font-size:16px;padding:12px 22px;border-radius:999px}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.fade{animation:fade .45s ease}
@keyframes fade{from{opacity:.25;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.emo{transition:none}}

details.manage{background:var(--surface);border:1px solid var(--line);border-radius:16px}
details.manage>summary{list-style:none;cursor:pointer;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:17px}
details.manage>summary::-webkit-details-marker{display:none}
details.manage>summary::after{content:"열기";font-weight:500;font-size:14px;color:var(--muted)}
details.manage[open]>summary::after{content:"닫기"}
.mbody{padding:0 22px 22px;display:flex;flex-direction:column;gap:18px}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:8px 14px;border-radius:999px;font-size:15px}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
form{display:grid;grid-template-columns:1fr 180px auto;gap:8px;align-items:end}
@media (max-width:620px){form{grid-template-columns:1fr}}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted);min-width:0}
input,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:46px}
.msg{font-size:14px;margin:0;min-height:1.4em;color:var(--muted)}
.msg.warn{color:var(--danger)}
ol.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line);max-height:440px;overflow-y:auto}
ol.list li{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line)}
ol.list .q{font-family:var(--f-quote);font-size:16px;min-width:0;word-break:keep-all}
ol.list .q span{display:block;font-family:var(--f-ui);font-size:13px;color:var(--muted)}
.del{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:6px 12px;font-size:14px;white-space:nowrap}
.del:hover,.del.confirm{border-color:var(--danger);color:var(--danger)}
.del.confirm{font-weight:600}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.ghost{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:6px 12px;font-size:14px}
.ghost.confirm{border-color:var(--danger);color:var(--danger);font-weight:600}
.empty{color:var(--muted);padding:16px 2px}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>마음 한 문장</h1>
    <p class="sub">지금의 마음을 고르면, 그 마음에 맞는 한 문장이 도착</p>
  </header>

  <section aria-labelledby="pick">
    <h2 id="pick" style="margin-bottom:10px">지금 마음은 어떤가요?</h2>
    <div class="emos" id="emos"></div>
  </section>

  <section class="card" id="card" aria-live="polite">
    <span class="tag" id="tag"></span>
    <p class="mark" aria-hidden="true">“</p>
    <div id="qbox">
      <blockquote id="quote"></blockquote>
      <p class="who" id="who"></p>
    </div>
    <div class="row">
      <span class="count" id="count"></span>
      <button class="btn" id="next" type="button">다른 명언 보기</button>
    </div>
  </section>

  <details class="manage" id="manage">
    <summary>명언 목록 관리</summary>
    <div class="mbody">
      <div class="tabs" role="tablist" id="tabs"></div>
      <form id="addForm" autocomplete="off">
        <label for="newQ">명언<textarea id="newQ" rows="1" required placeholder="추가할 문장 입력"></textarea></label>
        <label for="newW">발언자<input id="newW" required placeholder="예: 세네카"></label>
        <button class="btn" type="submit">추가</button>
      </form>
      <p class="msg" id="msg"></p>
      <ol class="list" id="list"></ol>
      <div class="foot">
        <span id="listCount"></span>
        <button class="ghost" id="reset" type="button">이 감정의 기본 목록으로 되돌리기</button>
      </div>
    </div>
  </details>
</div>

 anx:[
  ["걱정은 내일의 슬픔을 덜어주지 않는다. 오늘의 힘을 빼앗을 뿐이다.","코리 텐 붐"],

  ["스트레스에 맞서는 가장 큰 무기는 하나의 생각 대신 다른 생각을 고르는 능력이다.","윌리엄 제임스"],

  ["용기란 두려움이 없는 것이 아니라 두려움을 이겨내는 것이다.","넬슨 만델라"],
  ["할 수 있다고 믿든 할 수 없다고 믿든, 당신이 옳다.","헨리 포드"],
  ["당신의 동의 없이는 누구도 당신이 열등하다고 느끼게 할 수 없다.","엘리너 루스벨트"],
  ["내 인생은 끔찍한 불행으로 가득했지만, 그 대부분은 실제로 일어나지 않았다.","미셸 드 몽테뉴"],

  ["바꿀 수 없는 것을 받아들이는 평온과, 바꿀 수 있는 것을 바꾸는 용기와, 그 둘을 구별하는 지혜를 주소서.","라인홀드 니버"],

const KEY = "maeum-quotes-v1";
const toObj = arr => arr.map(([q,w],i)=>({id:"d"+i+"_"+w.length,q,w}));
function freshDefaults(k){return toObj(DEFAULTS[k])}
let data = {};
try{ const s = JSON.parse(localStorage.getItem(KEY)||"null"); if(s && typeof s==="object") data = s; }catch(e){}
for(const k in EMOS){ if(!Array.isArray(data[k])) data[k] = freshDefaults(k); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){} }

const $ = id => document.getElementById(id);
let current = null, lastId = null, manageKey = "joy";

// 감정 버튼
$("emos").innerHTML = Object.entries(EMOS).map(([k,v]) =>
  `<button class="emo" type="button" data-k="${k}" aria-pressed="false"><span class="dot" aria-hidden="true"></span><b>${v.name}</b><small>${v.hint}</small></button>`).join("");
$("emos").addEventListener("click", e=>{ const b=e.target.closest(".emo"); if(b) pick(b.dataset.k); });

function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function pick(k){
  current = k; lastId = null;
  document.body.dataset.emo = k;
  document.querySelectorAll(".emo").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.k===k)));
  manageKey = k; renderManage();
  show();
}
function show(){
  const list = data[current];
  $("tag").textContent = EMOS[current].tag;
  if(!list.length){
    $("quote").textContent = "이 감정에 등록된 명언 없음. 아래 목록 관리에서 추가 필요.";
    $("who").textContent = ""; $("who").hidden = true;
    $("count").textContent = "등록된 명언 0개"; $("next").disabled = true; return;
  }
  $("who").hidden = false; $("next").disabled = list.length < 2;
  let pool = list.filter(x=>x.id!==lastId); if(!pool.length) pool = list;
  const item = pool[Math.floor(Math.random()*pool.length)];
  lastId = item.id;
  $("quote").textContent = item.q;
  $("who").textContent = item.w;
  $("count").textContent = `${EMOS[current].name} · ${list.length}개 중 무작위 1개`;
  const box=$("qbox"); box.classList.remove("fade"); void box.offsetWidth; box.classList.add("fade");
}
$("next").addEventListener("click", show);

// 목록 관리
function renderTabs(){
  $("tabs").innerHTML = Object.entries(EMOS).map(([k,v])=>
    `<button class="tab" role="tab" type="button" data-k="${k}" aria-selected="${k===manageKey}">${v.name} (${data[k].length})</button>`).join("");
}
$("tabs").addEventListener("click", e=>{ const t=e.target.closest(".tab"); if(t){ manageKey=t.dataset.k; renderManage(); setMsg(""); }});
function renderManage(){
  renderTabs();
  const list = data[manageKey];
  $("list").innerHTML = list.length ? list.map(x=>
    `<li><p class="q" style="margin:0">${esc(x.q)}<span>${esc(x.w)}</span></p><button class="del" type="button" data-id="${x.id}">삭제</button></li>`).join("")
    : `<li class="empty">등록된 명언 없음. 위 입력란에서 추가 가능.</li>`;
  const n = list.length;
  $("listCount").textContent = n >= 20 ? `총 ${n}개 등록` : `총 ${n}개 등록 · 권장 개수(20개)보다 ${20-n}개 부족`;
  $("listCount").style.color = n >= 20 ? "" : "var(--danger)";
  resetBtnState(false);
}
function setMsg(t,warn){ $("msg").textContent=t; $("msg").className = "msg"+(warn?" warn":""); }

$("list").addEventListener("click", e=>{
  const b = e.target.closest(".del"); if(!b) return;
  if(!b.classList.contains("confirm")){
    document.querySelectorAll(".del.confirm").forEach(x=>{x.classList.remove("confirm");x.textContent="삭제";});
    b.classList.add("confirm"); b.textContent="한 번 더 눌러 삭제"; return;
  }
  data[manageKey] = data[manageKey].filter(x=>x.id!==b.dataset.id);
  save(); renderManage(); setMsg("명언 1개 삭제 완료");
  if(current===manageKey) show();
});

$("addForm").addEventListener("submit", e=>{
  e.preventDefault();
  const q=$("newQ").value.trim(), w=$("newW").value.trim();
  if(!q||!w){ setMsg("명언과 발언자를 모두 입력해야 추가 가능",true); return; }
  if(data[manageKey].some(x=>x.q===q)){ setMsg("이미 같은 문장이 목록에 있음",true); return; }
  data[manageKey].unshift({id:"u"+Date.now(),q,w});
  save(); $("newQ").value=""; $("newW").value="";
  renderManage(); setMsg(`'${EMOS[manageKey].name}'에 명언 추가 완료`);
});

let resetArmed=false;
function resetBtnState(on){ resetArmed=on; const r=$("reset"); r.classList.toggle("confirm",on);
  r.textContent = on ? "한 번 더 누르면 기본 목록으로 되돌림" : "이 감정의 기본 목록으로 되돌리기"; }
$("reset").addEventListener("click", ()=>{
  if(!resetArmed){ resetBtnState(true); return; }
  data[manageKey]=freshDefaults(manageKey); save(); renderManage();
  setMsg(`'${EMOS[manageKey].name}' 기본 목록 ${data[manageKey].length}개로 복원 완료`);
  if(current===manageKey) show();
});

// 첫 화면: 무작위 감정 하나를 골라 예시 문장 표시
pick(Object.keys(EMOS)[Math.floor(Math.random()*4)]);
</script>
