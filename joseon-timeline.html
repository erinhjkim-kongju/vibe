<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F6F4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="조선 연표">
<meta name="description" content="조선 건국부터 대한제국 수립까지, 사건을 실제 연도 간격으로 보여 주는 수업용 인터랙티브 연표">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232E7A69'/%3E%3Crect x='10' y='30' width='44' height='4' rx='2' fill='%23fff'/%3E%3Ccircle cx='18' cy='32' r='6' fill='%23C03E2D'/%3E%3Ccircle cx='46' cy='32' r='5' fill='%23fff'/%3E%3C/svg%3E">
<title>조선시대 연표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* 단독 실행용 기본 설정 */
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; -webkit-tap-highlight-color: transparent; }
.node, .btn { touch-action: manipulation; }
/* Layout: 상단 제목 → 실제 연도 비율의 가로 자 위 사건 노드 → 선택 사건 요약 → 팝업(모바일은 아래 시트) */
/* 교실 투사용으로 밝은 단일 테마를 의도적으로 사용 */
:root {
  --bg: #F2F6F4;        /* 옅은 청자빛 바탕 */
  --paper: #FFFFFF;
  --ink: #1D2A3B;       /* 쪽빛 글자 */
  --muted: #586577;
  --line: #C6D2CD;
  --jade: #2E7A69;      /* 단청 녹색 */
  --red: #C03E2D;       /* 단청 주홍 */
  --red-soft: #FBE9E5;
  --ochre: #D6A03C;
  --ochre-soft: #FBF2DE;
  --font-display: "Gowun Batang", "Nanum Myeongjo", "Batang", serif;
  --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body {
  font-family: var(--font-body);
  font-size: 18px;
  line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 40px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 24px; }

header { display: grid; gap: 6px; }
.eyebrow { font-size: 15px; letter-spacing: .12em; color: var(--jade); font-weight: 700; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(32px, 5vw, 48px); line-height: 1.2; margin: 0; text-wrap: balance; }
.lead { margin: 0; color: var(--muted); font-size: 19px; max-width: 60ch; }

/* 타임라인: 1392–1910 전체를 화면 폭(좁은 화면은 높이)에 맞춘 비례 축 */
.board { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; min-width: 0; }
.btn {
  font: inherit; font-size: 17px; cursor: pointer;
  border: 1.5px solid var(--ink); background: var(--paper); color: var(--ink);
  border-radius: 999px; padding: 8px 18px; min-height: 44px;
  transition: background .2s, color .2s;
}
.btn:hover { background: var(--ink); color: var(--paper); }
.btn:disabled { opacity: .35; cursor: default; background: var(--paper); color: var(--ink); }
.btn:focus-visible, .node:focus-visible, .close:focus-visible, .chip button:focus-visible { outline: 3px solid var(--ochre); outline-offset: 3px; }
.btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
.btn.primary:hover { background: var(--ink); border-color: var(--ink); }

.stage-wrap { padding: 20px 20px 8px; }
.stage { position: relative; width: 100%; }
.stage svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.stage svg path { fill: none; stroke: var(--line); stroke-width: 2; transition: stroke .3s; }
.stage svg path.on { stroke: var(--red); stroke-width: 2.5; }

.band { position: absolute; border-radius: 4px; }
.band.early { background: #DCEBE5; }
.band.late { background: #F6E6C2; }
.axis { position: absolute; background: var(--ink); border-radius: 2px; }
.progress { position: absolute; background: var(--red); border-radius: 2px; transition: width .7s cubic-bezier(.3,.7,.2,1), height .7s cubic-bezier(.3,.7,.2,1); }
.tick { position: absolute; background: var(--muted); }
.tick-label { position: absolute; font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.dot {
  position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%;
  background: var(--paper); border: 3px solid var(--ink);
  transition: transform .3s, background .3s, border-color .3s;
}
.dot.passed { border-color: var(--red); }
.dot.on { background: var(--red); border-color: var(--red); transform: scale(1.45); box-shadow: 0 0 0 6px rgba(192,62,45,.15); }

.node {
  position: absolute; background: var(--paper); border: 1.5px solid var(--line); border-radius: 8px;
  padding: 5px 12px; cursor: pointer; font: inherit; color: inherit; text-align: center;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
  white-space: nowrap; transition: border-color .3s, box-shadow .3s, transform .3s, background .3s;
}
.node .yr { font-family: var(--font-display); font-weight: 700; font-size: 21px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.node .nm { font-size: 17px; line-height: 1.3; }
.node.custom { border-style: dashed; border-color: var(--jade); }
.node.custom .yr { color: var(--jade); }
.node:hover { border-color: var(--ink); }
.node.on { border-style: solid; border-color: var(--red); background: var(--red-soft); box-shadow: 0 6px 16px rgba(192,62,45,.18); transform: translateY(-3px); }
.node.on .yr { color: var(--red); }
.node.down.on { transform: translateY(3px); }
.node.new { animation: pop .6s cubic-bezier(.3,.7,.2,1.4); }
@keyframes pop { from { transform: scale(.6); opacity: 0; } }
.vertical .node { flex-direction: row; justify-content: flex-start; gap: 10px; text-align: left; }
.vertical .node.on { transform: translateX(3px); }

.legend-custom i { background: none; border: 1.5px dashed var(--jade); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; padding: 4px 20px 18px; font-size: 16px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.legend i { width: 22px; height: 12px; border-radius: 3px; display: inline-block; }

/* 선택 사건 요약 */
.now {
  display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: center;
  background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 18px 22px;
}
.now-year { font-family: var(--font-display); font-weight: 700; font-size: 40px; color: var(--red); font-variant-numeric: tabular-nums; line-height: 1; }
.now-text { min-width: 0; }
.now-title { font-family: var(--font-display); font-weight: 700; font-size: 24px; }
.now-sum { color: var(--muted); font-size: 18px; }
@media (max-width: 640px) {
  .now { grid-template-columns: 1fr; gap: 10px; }
  .now-year { font-size: 34px; }
}

/* 사건 추가 */
.add { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; display: grid; gap: 14px; }
.add h2 { font-family: var(--font-display); font-size: 24px; margin: 0; }
.add-note { margin: 0; color: var(--muted); font-size: 16px; }
.form { display: grid; grid-template-columns: 130px minmax(0, 1fr) minmax(0, 2fr) auto; gap: 12px; align-items: end; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: 16px; font-weight: 700; }
.field input {
  font: inherit; font-size: 18px; padding: 9px 12px; min-height: 46px; width: 100%;
  border: 1.5px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink);
}
.field input:focus { outline: none; border-color: var(--jade); box-shadow: 0 0 0 3px #DCEBE5; }
.msg { margin: 0; font-size: 16px; min-height: 1.5em; }
.msg.err { color: var(--red); }
.msg.ok { color: var(--jade); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 4px; border: 1.5px dashed var(--jade); border-radius: 999px; padding: 2px 4px 2px 14px; font-size: 16px; }
.chip b { color: var(--jade); font-variant-numeric: tabular-nums; }
.chip button { font: inherit; border: 0; background: none; color: var(--muted); cursor: pointer; width: 34px; height: 34px; border-radius: 50%; font-size: 20px; }
.chip button:hover { background: var(--red-soft); color: var(--red); }
@media (max-width: 860px) { .form { grid-template-columns: 120px minmax(0, 1fr); } .form .wide, .form .btn { grid-column: 1 / -1; } }

/* 팝업 */
.overlay {
  position: fixed; inset: 0; background: rgba(29,42,59,.42); z-index: 20;
  display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  animation: fade .2s ease;
}
.pop {
  background: var(--paper); border-radius: 16px; width: min(640px, 100%); max-height: 100%; overflow-y: auto;
  border-top: 8px solid var(--red); padding: 26px 28px; display: grid; gap: 16px;
  animation: rise .3s cubic-bezier(.3,.7,.2,1);
}
.pop-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.pop-year { font-size: 17px; font-weight: 700; color: var(--red); letter-spacing: .04em; }
.pop h2 { font-family: var(--font-display); font-size: clamp(28px, 4vw, 36px); line-height: 1.2; margin: 2px 0 0; text-wrap: balance; }
.pop-king { font-size: 17px; color: var(--muted); }
.close {
  flex: none; width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid var(--line);
  background: var(--paper); color: var(--ink); font-size: 26px; line-height: 1; cursor: pointer;
}
.close:hover { border-color: var(--ink); }
.pop-body { display: grid; gap: 10px; font-size: 20px; line-height: 1.75; }
.pop-body p { margin: 0; }
.remember { background: var(--ochre-soft); border-radius: 10px; padding: 14px 18px; font-size: 19px; }
.remember b { color: #8A6320; display: block; font-size: 16px; letter-spacing: .06em; margin-bottom: 2px; }
.pop-foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
@media (max-width: 640px) {
  .overlay { place-items: end center; padding-bottom: 0; }
  .pop { border-radius: 16px 16px 0 0; max-height: 86vh; padding: 22px 20px calc(22px + env(safe-area-inset-bottom, 0px)); }
}
.overlay[hidden] { display: none; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(24px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">역사 · 사회 수업 자료</div>
    <h1>조선시대 연표</h1>
    <p class="lead">1392년 건국부터 1897년 대한제국까지, 505년의 흐름을 한 줄에 펼쳤어요. 사건 사이의 거리는 실제로 흐른 햇수만큼 벌어져 있어요.</p>
  </header>

  <section class="board" aria-label="조선시대 연표">
    <div class="stage-wrap"><div class="stage" id="stage"></div></div>
    <div class="legend">
      <span><i class="band early" style="position:static"></i>조선 전기 (1392–1592)</span>
      <span><i class="band late" style="position:static"></i>조선 후기 (1592–1897)</span>
      <span class="legend-custom"><i></i>직접 추가한 사건</span>
    </div>
  </section>

  <section class="now" aria-live="polite">
    <div class="now-year" id="nowYear">1392</div>
    <div class="now-text">
      <div class="now-title" id="nowTitle">조선 건국</div>
      <div class="now-sum" id="nowSum"></div>
    </div>
    <button class="btn primary" id="more" type="button">자세히 보기</button>
  </section>

  <section class="add" aria-labelledby="addTitle">
    <h2 id="addTitle">사건 추가하기</h2>
    <p class="add-note">1392년부터 1897년 사이의 사건을 넣으면 연표의 알맞은 자리에 바로 들어가요. 추가한 사건은 이 브라우저에 저장돼요.</p>
    <form class="form" id="addForm" novalidate>
      <div class="field"><label for="fYear">연도</label><input id="fYear" type="number" inputmode="numeric" min="1392" max="1897" placeholder="1776"></div>
      <div class="field"><label for="fTitle">사건 이름</label><input id="fTitle" type="text" maxlength="12" placeholder="규장각 설치"></div>
      <div class="field wide"><label for="fSum">쉬운 설명 (선택)</label><input id="fSum" type="text" maxlength="120" placeholder="정조가 책을 모아 두고 학자들이 공부하는 곳을 만들었어요."></div>
      <button class="btn primary" type="submit">연표에 넣기</button>
    </form>
    <p class="msg" id="msg" aria-live="polite"></p>
    <div class="chips" id="chips"></div>
  </section>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="pop" role="dialog" aria-modal="true" aria-labelledby="popTitle">
    <div class="pop-head">
      <div>
        <div class="pop-year" id="popYear"></div>
        <h2 id="popTitle"></h2>
        <div class="pop-king" id="popKing"></div>
      </div>
      <button class="close" id="close" type="button" aria-label="닫기">×</button>
    </div>
    <div class="pop-body" id="popBody"></div>
    <div class="remember" id="popRemember"></div>
    <div class="pop-foot">
      <button class="btn" id="popPrev" type="button">← 이전 사건</button>
      <button class="btn" id="popNext" type="button">다음 사건 →</button>
    </div>
  </div>
</div>

<script>
const BASE = [
  {
    year: 1392, title: "조선 건국", king: "태조 이성계",
    sum: "이성계가 고려를 대신해 새 나라 조선을 세웠어요.",
    body: [
      "고려 말에는 나라 안팎이 매우 어지러웠어요. 백성들의 살림도 힘들었지요.",
      "이때 싸움을 잘하던 장군 이성계가 새로운 나라를 세웠어요. 이 나라의 이름이 바로 ‘조선’이에요.",
      "얼마 뒤 수도를 한양으로 옮겼는데, 한양은 지금의 서울이에요."
    ],
    remember: "조선은 1392년에 시작해서 500년이 넘게 이어진 나라예요."
  },
  {
    year: 1418, title: "세종대왕 즉위", king: "세종 (조선 제4대 임금)",
    sum: "백성을 아낀 임금, 세종대왕이 왕이 되었어요.",
    body: [
      "‘즉위’는 임금의 자리에 오른다는 뜻이에요. 태종의 셋째 아들인 충녕대군이 왕이 되었고, 이분이 세종대왕이에요.",
      "세종대왕은 똑똑한 학자들을 ‘집현전’에 모아 함께 공부하고 연구했어요.",
      "비가 얼마나 왔는지 재는 측우기, 해 그림자로 시간을 알려 주는 해시계 같은 과학 기구도 이때 만들어졌어요."
    ],
    remember: "세종대왕은 백성이 편하게 살 수 있는 방법을 늘 고민한 임금이에요."
  },
  {
    year: 1443, title: "한글 창제", king: "세종",
    sum: "누구나 쉽게 배울 수 있는 우리 글자, 한글이 만들어졌어요.",
    body: [
      "‘창제’는 처음으로 만든다는 뜻이에요. 그전에는 어려운 한자를 써야 해서 많은 백성이 글을 읽고 쓰지 못했어요.",
      "세종대왕은 백성이 쉽게 배울 수 있도록 새 글자를 만들었어요. 처음 이름은 ‘훈민정음’, 백성을 가르치는 바른 소리라는 뜻이에요.",
      "3년 뒤인 1446년에 온 나라에 널리 알렸어요."
    ],
    remember: "한글은 처음에 28자였고, 지금 우리는 그중 24자를 써요."
  },
  {
    year: 1592, title: "임진왜란", king: "선조",
    sum: "일본이 쳐들어와 7년 동안 큰 전쟁이 이어졌어요.",
    body: [
      "일본이 큰 군대를 이끌고 조선에 쳐들어왔어요. 전쟁은 1598년까지 7년 동안이나 이어졌어요.",
      "바다에서는 이순신 장군이 거북선을 앞세워 일본 배들을 크게 물리쳤어요.",
      "땅에서는 평범한 백성과 스님들이 ‘의병’이 되어 스스로 나라를 지켰어요."
    ],
    remember: "임진왜란을 기준으로 조선을 ‘전기’와 ‘후기’로 나누기도 해요."
  },
  {
    year: 1636, title: "병자호란", king: "인조",
    sum: "청나라가 쳐들어와 임금이 남한산성으로 몸을 피했어요.",
    body: [
      "북쪽에서 힘이 세진 청나라가 조선에 쳐들어왔어요.",
      "인조 임금은 남한산성으로 피해 추운 겨울에 47일 동안 버텼어요.",
      "하지만 결국 삼전도라는 곳에서 청나라에 항복했어요. 조선 사람들에게 매우 슬프고 아픈 일이었어요."
    ],
    remember: "임진왜란이 끝나고 약 40년 뒤에 또 큰 전쟁이 일어난 거예요."
  },
  {
    year: 1897, title: "대한제국 수립", king: "고종 (대한제국 황제)",
    sum: "고종이 나라 이름을 ‘대한제국’으로 바꾸고 황제가 되었어요.",
    body: [
      "조선 말에는 일본, 청나라, 러시아 같은 힘센 나라들이 조선을 차지하려고 넘보았어요.",
      "고종은 우리나라가 다른 나라에 기대지 않는 당당한 나라라는 것을 세계에 알리고 싶었어요.",
      "그래서 1897년에 나라 이름을 ‘대한제국’으로 바꾸고, 왕이 아닌 ‘황제’의 자리에 올랐어요."
    ],
    remember: "대한제국이 세워지면서 ‘조선’이라는 이름의 시대가 끝났어요."
  }
];

const START = 1392, END = 1897;
const ERAS = [
  { cls: "early", from: 1392, to: 1592 },
  { cls: "late", from: 1592, to: 1897 }
];
const KEY = "joseon-timeline-custom-v1";
const stage = document.getElementById("stage");
let custom = [];
try { custom = JSON.parse(localStorage.getItem(KEY) || "[]").filter(e => e && e.id && e.title); } catch (e) { custom = []; }
let EVENTS = [], current = 0, nodes = [], dots = [], paths = [], progress, geo = null, freshId = null;

function rebuild() {
  EVENTS = BASE.map((e, i) => ({ ...e, id: "b" + i }))
    .concat(custom.map(e => ({ ...e, custom: true })))
    .sort((a, b) => a.year - b.year || (a.custom ? 1 : 0) - (b.custom ? 1 : 0));
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(custom)); } catch (e) {} }

function el(cls, style) {
  const d = document.createElement("div");
  d.className = cls;
  Object.assign(d.style, style);
  stage.appendChild(d);
  return d;
}

// 크기가 서로 다른 카드가 겹치지 않도록 이상적 위치에서 밀어내기
function spread(ideal, sizes, gap, lo, hi) {
  const c = ideal.slice(), n = c.length;
  for (let i = 0; i < n; i++) c[i] = Math.max(c[i], i ? c[i - 1] + (sizes[i - 1] + sizes[i]) / 2 + gap : lo + sizes[0] / 2);
  for (let i = n - 1; i >= 0; i--) c[i] = Math.min(c[i], i < n - 1 ? c[i + 1] - (sizes[i + 1] + sizes[i]) / 2 - gap : hi - sizes[i] / 2);
  return c;
}

function layout() {
  const W = stage.clientWidth;
  const vertical = W < 700;
  stage.innerHTML = "";
  stage.className = "stage" + (vertical ? " vertical" : "");
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  stage.appendChild(svg);
  nodes = []; dots = []; paths = [];
  EVENTS.forEach((ev, i) => makeNode(ev, i));
  const ws = nodes.map(n => n.offsetWidth), hs = nodes.map(n => n.offsetHeight);
  const h = Math.max(...hs);

  if (!vertical) {
    const padX = 34, gap = 12, rowGap = 10, reach = 50;
    const len = W - padX * 2;
    const pos = y => padX + (y - START) / (END - START) * len;
    // 카드가 한 줄에 다 들어가지 않으면 위아래로 줄을 늘림
    let R = 1;
    for (; R < 4; R++) {
      const lanes = 2 * R;
      let fits = true;
      for (let k = 0; k < lanes; k++) {
        const total = ws.filter((_, i) => i % lanes === k).reduce((a, w) => a + w + gap, 0);
        if (total > W) fits = false;
      }
      if (fits) break;
    }
    const lanes = 2 * R;
    const axisY = R * (h + rowGap) - rowGap + reach;
    stage.style.height = (axisY + reach + R * (h + rowGap)) + "px";
    ERAS.forEach(e => el("band " + e.cls, { left: pos(e.from) + "px", width: (pos(e.to) - pos(e.from)) + "px", top: (axisY - 9) + "px", height: "18px" }));
    el("axis", { left: padX + "px", width: len + "px", top: (axisY - 1.5) + "px", height: "3px" });
    progress = el("progress", { left: padX + "px", width: "0px", top: (axisY - 2.5) + "px", height: "5px" });
    for (let y = 1400; y <= END; y += 50) {
      const major = y % 100 === 0;
      el("tick", { left: pos(y) + "px", top: (axisY + 12) + "px", width: "1px", height: (major ? 12 : 6) + "px" });
      if (major) el("tick-label", { left: pos(y) + "px", top: (axisY + 24) + "px", transform: "translateX(-50%)" }).textContent = y + "년";
    }
    const centers = [];
    for (let k = 0; k < lanes; k++) {
      const idx = EVENTS.map((_, i) => i).filter(i => i % lanes === k);
      if (!idx.length) continue;
      const c = spread(idx.map(i => pos(EVENTS[i].year)), idx.map(i => ws[i]), gap, 0, W);
      idx.forEach((i, j) => centers[i] = c[j]);
    }
    geo = { vertical, pos, start: padX };
    EVENTS.forEach((ev, i) => {
      const k = i % lanes, up = k % 2 === 0, level = Math.floor(k / 2);
      const top = up ? axisY - reach - h - level * (h + rowGap) : axisY + reach + level * (h + rowGap);
      const dx = pos(ev.year), cx = centers[i];
      const from = up ? top + h : top, to = up ? axisY - 9 : axisY + 9, mid = (from + to) / 2;
      const p = document.createElementNS(svgNS, "path");
      p.setAttribute("d", `M${cx},${from} C${cx},${mid} ${dx},${mid} ${dx},${to}`);
      svg.appendChild(p); paths[i] = p;
      dots[i] = el("dot", { left: dx + "px", top: axisY + "px" });
      const n = nodes[i];
      if (!up) n.classList.add("down");
      Object.assign(n.style, { left: (cx - ws[i] / 2) + "px", top: top + "px", height: h + "px" });
    });
  } else {
    const axisX = 70, top = 14, cardX = 100, gap = 8;
    const ch = Math.max(...hs);
    const len = Math.max(EVENTS.length * (ch + gap) + 80, Math.min(window.innerHeight - 260, 640));
    const pos = y => top + (y - START) / (END - START) * len;
    stage.style.height = (top + len + 16) + "px";
    ERAS.forEach(e => el("band " + e.cls, { top: pos(e.from) + "px", height: (pos(e.to) - pos(e.from)) + "px", left: (axisX - 9) + "px", width: "18px" }));
    el("axis", { top: top + "px", height: len + "px", left: (axisX - 1.5) + "px", width: "3px" });
    progress = el("progress", { top: top + "px", height: "0px", left: (axisX - 2.5) + "px", width: "5px" });
    for (let y = 1400; y <= END; y += 50) {
      const major = y % 100 === 0;
      el("tick", { top: pos(y) + "px", left: (axisX - 12 - (major ? 14 : 7)) + "px", height: "1px", width: (major ? 14 : 7) + "px" });
      if (major) el("tick-label", { top: pos(y) + "px", right: (W - axisX + 30) + "px", transform: "translateY(-50%)" }).textContent = y;
    }
    const centers = spread(EVENTS.map(e => pos(e.year)), EVENTS.map(() => ch), gap, 0, top + len + 16);
    geo = { vertical, pos, start: top };
    EVENTS.forEach((ev, i) => {
      const dy = pos(ev.year), cy = centers[i], mid = (cardX + axisX) / 2;
      const p = document.createElementNS(svgNS, "path");
      p.setAttribute("d", `M${cardX},${cy} C${mid},${cy} ${mid},${dy} ${axisX + 9},${dy}`);
      svg.appendChild(p); paths[i] = p;
      dots[i] = el("dot", { left: axisX + "px", top: dy + "px" });
      Object.assign(nodes[i].style, { left: cardX + "px", top: (cy - ch / 2) + "px", maxWidth: (W - cardX) + "px", height: ch + "px" });
    });
  }
  select(current);
}

function makeNode(ev, i) {
  const n = document.createElement("button");
  n.type = "button";
  n.className = "node" + (ev.custom ? " custom" : "") + (ev.id === freshId ? " new" : "");
  n.setAttribute("aria-label", ev.year + "년 " + ev.title + " 자세히 보기");
  n.innerHTML = `<span class="yr"></span><span class="nm"></span>`;
  n.querySelector(".yr").textContent = ev.year;
  n.querySelector(".nm").textContent = ev.title;
  n.addEventListener("click", () => { select(i); openPop(); });
  stage.appendChild(n);
  nodes[i] = n;
  return n;
}

function select(i) {
  current = Math.max(0, Math.min(EVENTS.length - 1, i));
  const ev = EVENTS[current];
  nodes.forEach((n, k) => { n.classList.toggle("on", k === current); n.setAttribute("aria-current", k === current ? "true" : "false"); });
  dots.forEach((d, k) => { d.classList.toggle("on", k === current); d.classList.toggle("passed", k < current); });
  paths.forEach((p, k) => p.classList.toggle("on", k === current));
  progress.style[geo.vertical ? "height" : "width"] = (geo.pos(ev.year) - geo.start) + "px";

  document.getElementById("nowYear").textContent = ev.year;
  document.getElementById("nowTitle").textContent = ev.title;
  const after = current ? ` (${EVENTS[current - 1].title}에서 ${ev.year - EVENTS[current - 1].year}년 뒤)` : " (조선의 시작)";
  document.getElementById("nowSum").textContent = ev.sum + after;
  document.getElementById("popPrev").disabled = current === 0;
  document.getElementById("popNext").disabled = current === EVENTS.length - 1;
  if (!overlay.hidden) fillPop();
}

function renderChips() {
  const box = document.getElementById("chips");
  box.innerHTML = "";
  custom.slice().sort((a, b) => a.year - b.year).forEach(e => {
    const c = document.createElement("span");
    c.className = "chip";
    c.innerHTML = `<b></b><span></span><button type="button">×</button>`;
    c.querySelector("b").textContent = e.year;
    c.querySelector("span").textContent = e.title;
    const del = c.querySelector("button");
    del.setAttribute("aria-label", e.year + "년 " + e.title + " 지우기");
    del.onclick = () => {
      const curId = EVENTS[current] && EVENTS[current].id;
      custom = custom.filter(x => x.id !== e.id);
      save(); rebuild(); renderChips();
      const keep = EVENTS.findIndex(x => x.id === curId);
      current = keep >= 0 ? keep : Math.min(current, EVENTS.length - 1);
      freshId = null; layout();
      setMsg(`‘${e.title}’을(를) 연표에서 지웠어요.`, "ok");
    };
    box.appendChild(c);
  });
}

function setMsg(t, kind) { const m = document.getElementById("msg"); m.textContent = t; m.className = "msg " + (kind || ""); }

document.getElementById("addForm").addEventListener("submit", e => {
  e.preventDefault();
  const year = Number(document.getElementById("fYear").value);
  const title = document.getElementById("fTitle").value.trim();
  const sum = document.getElementById("fSum").value.trim();
  if (!Number.isInteger(year) || year < START || year > END) { setMsg(`연도는 ${START}부터 ${END} 사이의 숫자로 적어 주세요.`, "err"); document.getElementById("fYear").focus(); return; }
  if (!title) { setMsg("사건 이름을 적어 주세요.", "err"); document.getElementById("fTitle").focus(); return; }
  const item = { id: "c" + Date.now(), year, title, sum: sum || "선생님이 직접 추가한 사건이에요.", king: "" };
  custom.push(item);
  save(); rebuild(); renderChips();
  freshId = item.id;
  current = EVENTS.findIndex(x => x.id === item.id);
  layout();
  freshId = null;
  e.target.reset();
  setMsg(`${year}년 ‘${title}’을(를) 연표에 넣었어요.`, "ok");
});

const overlay = document.getElementById("overlay");
function fillPop() {
  const ev = EVENTS[current];
  document.getElementById("popYear").textContent = ev.year + "년 · " + (current + 1) + "번째 사건" + (ev.custom ? " · 직접 추가" : "");
  document.getElementById("popTitle").textContent = ev.title;
  const king = document.getElementById("popKing");
  king.textContent = ev.king ? "그때의 임금: " + ev.king : "";
  king.hidden = !ev.king;
  const body = document.getElementById("popBody");
  body.innerHTML = "";
  (ev.body || [ev.sum]).forEach(t => { const p = document.createElement("p"); p.textContent = t; body.appendChild(p); });
  const rem = document.getElementById("popRemember");
  rem.hidden = !ev.remember;
  if (ev.remember) rem.innerHTML = `<b>꼭 기억해요</b>${ev.remember}`;
}
function openPop() {
  overlay.hidden = false;
  fillPop();
  document.getElementById("close").focus();
}
function closePop() {
  overlay.hidden = true;
  nodes[current] && nodes[current].focus({ preventScroll: true });
}

document.getElementById("popPrev").onclick = () => select(current - 1);
document.getElementById("popNext").onclick = () => select(current + 1);
document.getElementById("more").onclick = openPop;
document.getElementById("close").onclick = closePop;
overlay.addEventListener("click", e => { if (e.target === overlay) closePop(); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !overlay.hidden) closePop();
  else if (e.target.closest && e.target.closest("input")) return;
  else if (e.key === "ArrowRight") select(current + 1);
  else if (e.key === "ArrowLeft") select(current - 1);
});

rebuild();
renderChips();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => layout());
let lastWidth = 0;
new ResizeObserver(() => {
  if (Math.abs(stage.clientWidth - lastWidth) < 2) return;
  lastWidth = stage.clientWidth;
  layout();
}).observe(stage);
</script>
</body>
</html>
