<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고요한 책상</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&family=Noto+Sans+KR:wght@300;400;500&display=swap">

<style>
  :root {
    --bg: #ffffff;
    --ink: #202124;
    --ink-soft: #5f6368;
    --border: #dfe1e5;
    --border-strong: #dadce0;
    --surface: #f8f9fa;
    --accent: #1a73e8;
    --focus-ring: rgba(26, 115, 232, 0.22);
    --footer-bg: #f2f2f2;
    --footer-border: #e4e4e4;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #202124;
      --ink: #e8eaed;
      --ink-soft: #9aa0a6;
      --border: #5f6368;
      --border-strong: #71767a;
      --surface: #303134;
      --accent: #8ab4f8;
      --focus-ring: rgba(138, 180, 248, 0.25);
      --footer-bg: #171717;
      --footer-border: #2a2a2a;
    }
  }

  :root[data-theme="dark"] {
    --bg: #202124;
    --ink: #e8eaed;
    --ink-soft: #9aa0a6;
    --border: #5f6368;
    --border-strong: #71767a;
    --surface: #303134;
    --accent: #8ab4f8;
    --focus-ring: rgba(138, 180, 248, 0.25);
    --footer-bg: #171717;
    --footer-border: #2a2a2a;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans KR", "Roboto", "Apple SD Gothic Neo", "Malgun Gothic", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem 4.5rem;
  }

  .page {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 560px;
  }

  .clock {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    line-height: 1;
    font-family: "Roboto", Arial, sans-serif;
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    font-size: clamp(3.75rem, 13vw, 6.75rem);
    letter-spacing: -0.01em;
    color: var(--ink);
  }

  .clock .colon {
    color: var(--accent);
    animation: blink 2s steps(1) infinite;
    padding: 0 0.03em;
  }

  @media (prefers-reduced-motion: reduce) {
    .clock .colon { animation: none; }
  }

  @keyframes blink {
    0%, 45% { opacity: 1; }
    50%, 95% { opacity: 0.25; }
    100% { opacity: 1; }
  }

  .clock .sec {
    font-family: "Roboto", Arial, sans-serif;
    font-size: 0.3em;
    font-weight: 400;
    color: var(--ink-soft);
    padding: 0 0 0.6em 0.4em;
  }

  .date {
    margin-top: 0.4rem;
    font-size: clamp(0.9rem, 2.1vw, 1.05rem);
    font-weight: 400;
    color: var(--ink-soft);
    text-align: center;
  }

  .search {
    margin-top: 2.25rem;
    width: min(560px, 92vw);
  }

  .search-field {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 0.7rem 1.25rem;
    transition: box-shadow 0.15s ease, border-color 0.15s ease;
  }

  .search-field:hover {
    box-shadow: 0 1px 6px rgba(32, 33, 36, 0.18);
    border-color: transparent;
  }

  .search-field:focus-within {
    box-shadow: 0 1px 6px rgba(32, 33, 36, 0.22);
    border-color: transparent;
  }

  .search-field svg {
    flex: none;
    width: 19px;
    height: 19px;
    stroke: var(--ink-soft);
  }

  .search-field input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    color: var(--ink);
    font-family: "Noto Sans KR", "Roboto", Arial, sans-serif;
    font-size: 1rem;
    font-weight: 400;
  }

  .search-field input::placeholder {
    color: var(--ink-soft);
    opacity: 0.85;
  }

  .go {
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 2px;
    margin: -2px;
    border-radius: 50%;
    cursor: pointer;
    transition: background-color 0.15s ease;
  }

  .go svg {
    transition: stroke 0.15s ease;
  }

  .go:hover svg {
    stroke: var(--accent);
  }

  .go:focus-visible,
  .search-field input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  footer.world {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: clamp(1.1rem, 4vw, 2.2rem);
    flex-wrap: wrap;
    background: var(--footer-bg);
    border-top: 1px solid var(--footer-border);
    padding: 0.85rem 1.5rem;
  }

  .tz {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
  }

  .tz-city {
    font-family: "Noto Sans KR", "Roboto", Arial, sans-serif;
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
  }

  .tz-time {
    font-family: "Roboto", Arial, sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }

  .tz-offset {
    font-family: "Noto Sans KR", "Roboto", Arial, sans-serif;
    font-size: 0.72rem;
    font-weight: 400;
    color: var(--accent);
    opacity: 0.9;
  }

  .tz-divider {
    width: 1px;
    height: 0.9rem;
    align-self: center;
    background: var(--border-strong);
  }
</style>
</head>
<body>

<main>
  <div class="page">
    <div class="clock" aria-label="현재 시각">
      <span id="hh">00</span><span class="colon">:</span><span id="mm">00</span><span class="sec" id="ss">00</span>
    </div>

    <div class="date" id="date">불러오는 중…</div>

    <div class="search">
      <div class="search-field">
        <a class="go" id="go" href="https://www.google.com/search" target="_blank" rel="noopener noreferrer" aria-label="Google 검색">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </a>
        <input type="text" id="q" placeholder="Google 검색" autocomplete="off" autofocus>
      </div>
    </div>
  </div>
</main>

<footer class="world" aria-label="다른 지역 시각">
  <div class="tz">
    <span class="tz-city">뉴욕</span>
    <span class="tz-time" id="ny-time">--:--</span>
    <span class="tz-offset" id="ny-offset"></span>
  </div>
  <span class="tz-divider" aria-hidden="true"></span>
  <div class="tz">
    <span class="tz-city">캘리포니아</span>
    <span class="tz-time" id="la-time">--:--</span>
    <span class="tz-offset" id="la-offset"></span>
  </div>
</footer>

<script>
  var SEOUL = "Asia/Seoul";
  var NEW_YORK = "America/New_York";
  var CALIFORNIA = "America/Los_Angeles";

  function clockParts(date, timeZone) {
    var parts = new Intl.DateTimeFormat("en-GB", {
      timeZone: timeZone,
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hour12: false
    }).formatToParts(date);
    var out = {};
    parts.forEach(function (p) { out[p.type] = p.value; });
    return out;
  }

  function isoDate(date, timeZone) {
    return new Intl.DateTimeFormat("en-CA", {
      timeZone: timeZone,
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).format(date);
  }

  function dayOffsetLabel(date, timeZone) {
    var base = isoDate(date, SEOUL);
    var other = isoDate(date, timeZone);
    if (base === other) return "";
    var diff = Math.round(
      (new Date(other + "T00:00:00Z") - new Date(base + "T00:00:00Z")) / 86400000
    );
    if (diff === -1) return "어제";
    if (diff === 1) return "내일";
    return (diff > 0 ? "+" : "") + diff + "일";
  }

  function tick() {
    var now = new Date();

    var seoul = clockParts(now, SEOUL);
    document.getElementById("hh").textContent = seoul.hour;
    document.getElementById("mm").textContent = seoul.minute;
    document.getElementById("ss").textContent = seoul.second;

    document.getElementById("date").textContent = new Intl.DateTimeFormat("ko-KR", {
      timeZone: SEOUL,
      year: "numeric",
      month: "long",
      day: "numeric",
      weekday: "long"
    }).format(now);

    var ny = clockParts(now, NEW_YORK);
    document.getElementById("ny-time").textContent = ny.hour + ":" + ny.minute;
    document.getElementById("ny-offset").textContent = dayOffsetLabel(now, NEW_YORK);

    var la = clockParts(now, CALIFORNIA);
    document.getElementById("la-time").textContent = la.hour + ":" + la.minute;
    document.getElementById("la-offset").textContent = dayOffsetLabel(now, CALIFORNIA);
  }

  tick();
  setInterval(tick, 1000);

  var input = document.getElementById("q");
  var go = document.getElementById("go");

  function updateSearchLink() {
    var query = input.value.trim();
    go.href = query
      ? "https://www.google.com/search?q=" + encodeURIComponent(query)
      : "https://www.google.com/";
  }

  input.addEventListener("input", updateSearchLink);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      updateSearchLink();
      go.click();
    }
  });
  updateSearchLink();
</script>
</body>
</html>
